# 모니터링 프로필: --spring.profiles.active=local,monitor 처럼 기존 프로필에 덧붙여 사용한다.
# 운영 배포 시에는 management 포트를 방화벽/보안그룹으로 내부망에만 열어야 한다.
management:
  server:
    # 지표 엔드포인트를 서비스 포트(8080)와 분리해 외부 노출 위험을 줄인다.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # http 요청 지연시간의 p50/p95/p99 를 기록한다.
      #
      # [주의 1] 키에 점(.)이 있으면 Spring이 중첩 키로 해석하므로 Map 키는 대괄호로 감싼다.
      # [주의 2] 이 버전에서 percentiles-histogram 과 percentiles 는 배타적이다 (실측 확인).
      #   - percentiles-histogram: true  → *_bucket 만 나오고 quantile 라인은 사라진다.
      #     Prometheus 서버에서 histogram_quantile() 로 계산하며, 인스턴스 간 합산이 가능하다.
      #   - percentiles: (현재)          → *{quantile="0.5"} 이 스크레이프에 바로 찍힌다.
      #     Prometheus 없이 /actuator/prometheus 만 봐도 읽히지만 합산은 안 된다.
      # 아직 Prometheus·Grafana 서버가 없으므로 "바로 읽히는" 쪽을 기본값으로 둔다.
      # 대시보드를 붙이는 시점에 아래 두 블록을 서로 바꾼다.
      percentiles-histogram:
        "[http.server.requests]": false
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        enabled: true
