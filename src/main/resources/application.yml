spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    # 프로필 누락으로 공용 RDS에 접속하지 않도록 안전한 로컬 환경을 기본값으로 둔다.
    default: local
  application:
    name: cakeshop
  thymeleaf:
    # 배포(rds 등)에서는 템플릿을 캐싱한다. 로컬 개발용 핫리로드는 local 프로필에서 끈다.
    cache: true
  servlet:
    multipart:
      # 매장·상품 등의 이미지 업로드 상한. 기본값(1MB)은 사진에 너무 작다.
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: true
    # 운영에도 필요한 스키마·코드값만 여기 둔다. 개발용 더미 시드는 local 프로필이 db/seed를 더한다.
    locations: classpath:db/migration
    # 전환 이전부터 쓰던 DB(각자 로컬 + 공용 RDS)는 이미 스키마가 있어 "빈 스키마가 아니다"로 부팅이
    # 막힌다. V1(베이스라인)이 적용된 것으로 표시하고 V2부터 이어가게 한다.
    # 전원이 한 번씩 부팅해 baseline 기록을 남긴 뒤에는 false로 되돌린다(빈 DB 오인 baseline 방지).
    baseline-on-migrate: true
    baseline-version: 1
    # 이미 적용된 마이그레이션 파일을 고치면 체크섬 불일치로 부팅을 막는다. 도입 목적 그 자체다.
    validate-on-migrate: true
  task:
    scheduling:
      # @Scheduled 기본 풀은 1개라 배치가 둘 이상이면 서로 밀린다(알림 재시도 + 결제 상태 대조).
      pool:
        size: 4

server:
  tomcat:
    # 파일 input이 있는 폼은 전체가 multipart라 텍스트·체크박스·CSRF까지 모두 part로 계산된다.
    # Tomcat 11 기본 상한(10)은 매장/상품 폼처럼 필드가 많은 화면에서 쉽게 초과되므로 넉넉히 올린다.
    max-part-count: 100

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cakeshop.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  file:
    # 업로드 파일을 저장할 로컬 외부 디렉토리 (프로젝트 밖). .env 의 FILE_UPLOAD_DIR 로 지정.
    upload-dir: ${FILE_UPLOAD_DIR:${user.home}/cakeshop-uploads}
    # 저장 파일에 접근하는 웹 경로 접두. WebConfig 리소스 핸들러와 짝을 이룬다.
    url-prefix: /uploads
  chat:
    # 채팅 이미지는 /uploads/** 공개 리소스와 분리하며, 소유권 검사 API로만 읽는다.
    private-image-dir: ${CHAT_IMAGE_DIR:${user.home}/cakeshop-chat-images}

cakeshop:
  payment:
    # mock: 외부 호출 없이 즉시 승인(테스트·CI·스모크 기본). toss: 결제창 + 실승인.
    # 키 없이 toss로 켜면 승인 단계에서 실패하므로 기본값은 mock으로 둔다.
    provider: ${PAYMENT_PROVIDER:mock}
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
    reconcile:
      # 결제창을 닫아버려 READY로 남은 결제를 대조하는 주기와, 대조 대상이 되는 방치 시간.
      interval: 300000
      stale-minutes: 30

---
# 기본 개발 환경: 각 PC에 직접 설치한 MariaDB
spring:
  config:
    activate:
      on-profile: local
  # 로컬 개발에서는 템플릿 수정 즉시 반영되도록 캐시를 끈다.
  thymeleaf:
    cache: false
  flyway:
    # 개발용 샘플 데이터(db/seed/R__dev_seed.sql)는 로컬에서만 적용한다. 공용 RDS에는 넣지 않는다.
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: jdbc:mariadb://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT}/${LOCAL_DB_DATABASE}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}

---
# 공용 AWS RDS: 프로젝트 루트의 .env에서 접속 정보를 읽는다.
spring:
  config:
    activate:
      on-profile: rds
  flyway:
    # 공용 RDS 스키마가 아무나의 bootRun으로 바뀌면 안 된다. 반영은 스키마 담당자가 의도적으로,
    # 다음처럼 한 번만 켜서 수행한다.
    #   .\gradlew.bat bootRun --args="--spring.profiles.active=rds --spring.flyway.enabled=true"
    enabled: false
  datasource:
    # 공용 개발 RDS의 require_secure_transport=ON 대응: TLS로 암호화해 연결한다.
    url: "jdbc:mariadb://${RDS_ENDPOINT}:${RDS_PORT:3306}/${RDS_DATABASE}?sslMode=trust"
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
