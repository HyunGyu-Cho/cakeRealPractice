<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('후기 작성')}"></head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--form">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 th:text="${editingReviewId == null} ? '후기 작성' : '후기 수정'">후기 작성</h1>

  <section class="section" th:if="${target != null}">
    <h2 class="section-title">주문 상품</h2>
    <div class="panel">
      <strong th:text="${target.productName}">상품명</strong>
      <p class="text-muted">
        <span th:text="${target.orderNumber}">주문번호</span> |
        <span th:text="|${#temporals.format(target.pickupAt, 'yyyy.MM.dd')} 픽업 완료|">픽업 완료</span>
      </p>
    </div>
  </section>

  <form method="post" enctype="multipart/form-data" th:object="${reviewForm}"
        th:action="${editingReviewId == null}
                   ? @{/reviews(orderItemId=${reviewForm.orderItemId})}
                   : @{|/reviews/${editingReviewId}/edit|}">
    <p class="form-error" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    <input type="hidden" th:field="*{orderItemId}">

    <section class="section">
      <h2 class="section-title">평점 선택</h2>
      <!-- 종합만 필수다. 세부 3축을 강제하면 작성률이 떨어진다(스펙 6장 규칙 3). -->
      <div class="panel stack">
        <div class="form-group">
          <label for="overallRating">종합 <span class="required">*</span></label>
          <select class="form-control" th:field="*{overallRating}">
            <option value="">선택</option>
            <option th:each="score : ${#numbers.sequence(5, 1)}"
                    th:value="${score}" th:text="|${score}점|">5점</option>
          </select>
          <p class="form-error" th:errors="*{overallRating}"></p>
        </div>
        <div class="grid grid--3">
          <div class="form-group">
            <label for="tasteRating">맛 (선택)</label>
            <select class="form-control" th:field="*{tasteRating}">
              <option value="">선택 안 함</option>
              <option th:each="score : ${#numbers.sequence(5, 1)}"
                      th:value="${score}" th:text="|${score}점|">5점</option>
            </select>
            <p class="form-error" th:errors="*{tasteRating}"></p>
          </div>
          <div class="form-group">
            <label for="designRating">디자인 (선택)</label>
            <select class="form-control" th:field="*{designRating}">
              <option value="">선택 안 함</option>
              <option th:each="score : ${#numbers.sequence(5, 1)}"
                      th:value="${score}" th:text="|${score}점|">5점</option>
            </select>
            <p class="form-error" th:errors="*{designRating}"></p>
          </div>
          <div class="form-group">
            <label for="serviceRating">응대 (선택)</label>
            <select class="form-control" th:field="*{serviceRating}">
              <option value="">선택 안 함</option>
              <option th:each="score : ${#numbers.sequence(5, 1)}"
                      th:value="${score}" th:text="|${score}점|">5점</option>
            </select>
            <p class="form-error" th:errors="*{serviceRating}"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">후기 내용</h2>
      <div class="panel">
        <div class="form-group">
          <label class="form-label" for="content">내용 <span class="required">*</span></label>
          <textarea class="form-control form-control--textarea" th:field="*{content}"
                    placeholder="후기를 작성해 주세요 (최소 10자 이상)"></textarea>
          <p class="form-error" th:errors="*{content}"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="images">이미지 첨부 (선택, 최대 3장)</label>
          <div class="cluster" th:if="${currentImageUrls != null and !currentImageUrls.isEmpty()}">
            <img class="placeholder-image placeholder-image--sm" style="object-fit:cover"
                 th:each="url : ${currentImageUrls}" th:src="${url}" alt="첨부 이미지">
          </div>
          <input class="form-control" id="images" type="file" name="images"
                 accept="image/jpeg,image/png" multiple>
          <p class="form-help">새 파일을 선택할 때만 기존 이미지가 교체됩니다. 장당 5MB 이하 JPG·PNG.</p>
        </div>
      </div>
    </section>

    <div class="cluster">
      <button class="btn btn--primary" type="submit"
              th:text="${editingReviewId == null} ? '후기 등록' : '수정 저장'">후기 등록</button>
      <a class="btn" th:href="@{/reviews}">내 후기함</a>
    </div>
  </form>

  <form method="post" th:if="${editingReviewId != null}" class="section"
        th:action="@{|/reviews/${editingReviewId}/delete|}"
        data-confirm-submit="후기를 삭제하시겠습니까? 삭제하면 같은 주문 상품에 다시 작성할 수 있습니다.">
    <button class="btn btn--danger" type="submit">삭제하기</button>
  </form>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
