<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>1:1 채팅 문의 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
  <script defer th:src="@{/webjars/stomp__stompjs/7.3.0/bundles/stomp.umd.min.js}"></script>
  <script defer th:src="@{/js/chat.js}"></script>
</head>
<body data-page-title="1:1 채팅 문의">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container chat-page" data-chat-root
        th:attr="data-room-id=${chat.roomId}">
    <div class="cluster cluster--between section">
      <div>
        <h1>1:1 채팅 문의</h1>
        <p class="text-muted">상담 내역은 계속 보관되며, 종료된 상담도 메시지를 보내면 다시 열립니다.</p>
      </div>
      <a class="btn" th:href="@{/mypage}">마이페이지로 돌아가기</a>
    </div>

    <div class="chat-layout">
      <aside class="panel chat-orders">
        <strong>연결된 주문</strong>
        <div class="chat-empty-side">
          <p>아직 연결된 주문이 없습니다.</p>
          <span>주문제작 요청 처리는 다음 단계에서 연결됩니다.</span>
        </div>
      </aside>

      <section class="panel chat-room">
        <header class="chat-room__header">
          <div>
            <strong>케이크샵 1:1 상담</strong>
            <p class="text-muted" th:text="|${chat.customerName} 고객님 전용 상담방|"></p>
          </div>
          <div class="cluster">
            <span class="chat-connection" data-chat-connection>연결 중</span>
            <span class="badge" data-room-status
                  th:classappend="${chat.status == 'OPEN'} ? ' badge--success' : ''"
                  th:text="${chat.statusLabel}"></span>
          </div>
        </header>

        <button type="button" class="btn chat-load-older" data-load-older
                th:hidden="${#lists.isEmpty(chat.messages)}">이전 대화 불러오기</button>

        <div class="chat-messages" data-chat-messages aria-live="polite">
          <div class="chat-empty" data-chat-empty th:hidden="${!#lists.isEmpty(chat.messages)}">
            <strong>궁금한 내용을 남겨 주세요.</strong>
            <span>텍스트 또는 이미지 한 장을 보낼 수 있습니다.</span>
          </div>

          <article th:each="message : ${chat.messages}"
                   class="chat-msg"
                   th:classappend="${message.senderType == 'SYSTEM'} ? ' chat-msg--system' :
                       (${message.senderType == 'CUSTOMER'} ? ' chat-msg--me' : ' chat-msg--other')"
                   th:attr="data-message-id=${message.id},data-sender-type=${message.senderType}">
            <span class="chat-msg__sender" th:if="${message.senderType == 'ADMIN'}">케이크샵 담당자</span>
            <div class="chat-msg__body">
              <img class="chat-msg__image" th:if="${message.hasImage}"
                   th:src="${message.imageUrl}" alt="채팅 첨부 이미지">
              <p class="chat-msg__content" th:if="${message.content != null}"
                 th:text="${message.content}"></p>
              <a class="btn btn--primary chat-msg__action"
                 th:if="${message.actionUrl != null}"
                 th:href="${message.actionUrl}">주문제작 시작하기</a>
            </div>
            <div class="chat-msg__meta" th:if="${message.senderType != 'SYSTEM'}">
              <span class="chat-msg__read" th:if="${message.senderType == 'CUSTOMER'}"
                    th:text="${message.read} ? '읽음' : '읽지 않음'"></span>
              <time th:text="${#temporals.format(message.createdAt, 'MM.dd HH:mm')}"></time>
            </div>
          </article>
        </div>

        <div class="chat-compose">
          <div class="chat-preview" data-image-preview hidden>
            <img alt="전송 전 이미지 미리보기">
            <span data-image-name></span>
            <button type="button" class="btn btn--xs" data-image-clear>첨부 취소</button>
          </div>
          <p class="form-error" data-chat-error role="alert" hidden></p>
          <form data-chat-form enctype="multipart/form-data">
            <div class="chat-input-toolbar">
              <label class="btn btn--outline">
                이미지 첨부
                <input type="file" name="image" accept="image/jpeg,image/png" data-chat-image hidden>
              </label>
              <button type="button" class="btn btn--outline" data-custom-order>/주문제작</button>
              <span class="text-muted">JPG/PNG · 최대 5MB</span>
            </div>
            <div class="chat-input-row">
              <textarea class="form-control" name="content" data-chat-input
                        maxlength="2000" rows="2"
                        placeholder="메시지를 입력하세요."></textarea>
              <button type="submit" class="btn btn--primary" data-chat-send>전송</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
