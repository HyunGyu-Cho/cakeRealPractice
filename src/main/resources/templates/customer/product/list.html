<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 목록 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="상품 목록">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container ">
    <h1>상품 목록</h1>
    <form class="cluster section" role="search" method="get" th:action="@{/products}">
      <input type="hidden" name="type" th:value="${search.normalizedType}">
      <input type="hidden" name="minPrice" th:value="${search.minPrice}">
      <input type="hidden" name="maxPrice" th:value="${search.maxPrice}">
      <input type="hidden" name="sale" th:value="${search.normalizedSale}">
      <input type="hidden" name="pickupToday" th:value="${search.pickupTodayOnly} ? 'true' : ''">
      <input type="hidden" name="sort" th:value="${currentSort}">
      <label class="visually-hidden" for="product-search">상품명 검색</label>
      <input class="form-control" id="product-search" type="search" name="keyword"
             placeholder="상품명 검색" style="flex:1" th:value="${search.keyword}">
      <button class="btn btn--primary" type="submit">검색</button>
    </form>
    <div class="layout-sidebar">
      <aside class="filter-panel">
        <form method="get" th:action="@{/products}">
          <input type="hidden" name="keyword" th:value="${search.keyword}">
          <input type="hidden" name="sort" th:value="${currentSort}">
          <h2 class="section-title">필터</h2>
          <div class="form-group">
            <strong class="form-label">상품 유형</strong>
            <div class="filter-options">
              <label class="choice"><input type="radio" name="type" value="" th:checked="${search.normalizedType == null}"> 전체</label>
              <label class="choice"><input type="radio" name="type" value="GENERAL" th:checked="${search.normalizedType == 'GENERAL'}"> 일반 케이크</label>
              <label class="choice"><input type="radio" name="type" value="CUSTOM" th:checked="${search.normalizedType == 'CUSTOM'}"> 주문 제작</label>
              <label class="choice"><input type="radio" name="type" value="SAME_DAY" th:checked="${search.normalizedType == 'SAME_DAY'}"> 당일 픽업</label>
              <label class="choice"><input type="radio" name="type" value="SEASON" th:checked="${search.normalizedType == 'SEASON'}"> 시즌 상품</label>
            </div>
          </div>
          <div class="form-group">
            <strong class="form-label">가격대</strong>
            <div class="price-range">
              <input class="form-control" type="number" name="minPrice" min="0" step="1000"
                     aria-label="최소 가격" placeholder="최소" th:value="${search.minPrice}">
              <span>~</span>
              <input class="form-control" type="number" name="maxPrice" min="0" step="1000"
                     aria-label="최대 가격" placeholder="최대" th:value="${search.maxPrice}">
            </div>
          </div>
          <div class="form-group">
            <strong class="form-label">판매 상태</strong>
            <div class="stack">
              <label class="choice"><input type="radio" name="sale" value="" th:checked="${search.normalizedSale == null}"> 전체</label>
              <label class="choice"><input type="radio" name="sale" value="ON_SALE" th:checked="${search.normalizedSale == 'ON_SALE'}"> 판매 중</label>
              <label class="choice"><input type="radio" name="sale" value="SOLD_OUT" th:checked="${search.normalizedSale == 'SOLD_OUT'}"> 품절</label>
              <label class="choice"><input type="radio" name="sale" value="INACTIVE" th:checked="${search.normalizedSale == 'INACTIVE'}"> 판매 중지</label>
            </div>
          </div>
          <label class="choice form-group">
            <input type="checkbox" name="pickupToday" value="true" th:checked="${search.pickupTodayOnly}"> 픽업 가능 상품만
          </label>
          <div class="stack">
            <button class="btn btn--primary btn--block" type="submit">필터 적용</button>
            <a class="btn btn--block" th:href="@{/products}">필터 초기화</a>
          </div>
        </form>
      </aside>
      <section>
        <div class="cluster cluster--between section">
          <span class="text-muted" th:text="|총 ${pageResult.totalElements}개 상품|">총 0개 상품</span>
          <div class="cluster">
            <a class="btn" th:classappend="${currentSort == 'latest'} ? 'is-active'"
               th:href="@{|/products?page=1${filterQuery}&sort=latest|}">최신순</a>
            <a class="btn" th:classappend="${currentSort == 'popular'} ? 'is-active'"
               th:href="@{|/products?page=1${filterQuery}&sort=popular|}">인기순</a>
            <a class="btn" th:classappend="${currentSort == 'priceAsc'} ? 'is-active'"
               th:href="@{|/products?page=1${filterQuery}&sort=priceAsc|}">가격 낮은순</a>
            <a class="btn" th:classappend="${currentSort == 'priceDesc'} ? 'is-active'"
               th:href="@{|/products?page=1${filterQuery}&sort=priceDesc|}">가격 높은순</a>
          </div>
        </div>
        <div class="grid grid--3 product-grid" th:if="${!pageResult.content.isEmpty()}">
          <a class="product-card" th:each="product : ${pageResult.content}" th:href="@{|/products/${product.id}|}">
            <img class="placeholder-image" th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                 th:alt="${product.name}" style="object-fit:cover">
            <div class="placeholder-image" th:if="${product.imageUrl == null}">상품 이미지</div>
            <div class="product-card__body">
              <h3 class="product-card__name" th:text="${product.name}">상품명</h3>
              <p class="product-card__price" th:text="|${#numbers.formatInteger(product.basePrice, 3, 'COMMA')}원|">0원</p>
              <span class="badge" th:text="${product.productTypeLabel}">유형</span>
              <span class="badge badge--danger" th:if="${product.status == 'INACTIVE'}" th:text="${product.statusLabel}">판매 중지</span>
              <span th:if="${product.status == 'ACTIVE'}"
                    class="badge"
                    th:classappend="${product.stockLabel == '품절'} ? 'badge--danger' : (${product.stockLabel == '재고 부족'} ? 'badge--warning' : 'badge--success')"
                    th:text="${product.stockLabel}">재고 있음</span>
            </div>
          </a>
        </div>
        <div class="panel panel--dashed text-muted" th:if="${pageResult.content.isEmpty()}"
             style="text-align:center;margin-top:12px">조건에 맞는 상품이 없습니다.</div>
        <nav th:replace="~{fragments/common/pagination :: pagination(${pageResult}, '/products', ${extraQuery})}"></nav>
      </section>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
