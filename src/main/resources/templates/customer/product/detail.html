<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras-spring-security">
<head>
  <th:block th:replace="~{fragments/common/head :: head('상품 상세 | 케이크 쇼핑몰')}"></th:block>
</head>
<body data-page-title="상품 상세">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container ">
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <h1 class="visually-hidden">상품 상세</h1>
    <p class="text-muted section">
      <a href="/">메인</a> &gt; <a th:href="@{/products}">전체 상품</a> &gt; <span th:text="${product.name}">상품명</span>
    </p>
    <section class="grid grid--2 section">
      <div class="product-gallery">
        <img class="placeholder-image placeholder-image--lg" th:if="${product.imageUrl != null}"
             th:src="${product.imageUrl}" th:alt="${product.name}" style="object-fit:cover">
        <div class="placeholder-image placeholder-image--lg" th:if="${product.imageUrl == null}">상품 이미지</div>
      </div>
      <div>
        <span class="badge" th:text="${product.productTypeLabel}">유형</span>
        <h2 style="font-size:20px;margin-top:4px" th:text="${product.name}">상품명</h2>
        <p style="font-size:16px;font-weight:600" th:text="|${#numbers.formatInteger(product.basePrice, 3, 'COMMA')}원|">0원</p>
        <p class="panel panel--soft section" th:if="${product.description != null}" th:text="${product.description}">상품 설명</p>
        <div class="data-row">
          <span class="data-row__label">판매 상태</span>
          <span><span class="badge" th:classappend="${product.status == 'ACTIVE'} ? 'badge--success' : 'badge--danger'"
                th:text="${product.statusLabel}">판매 중</span></span>
        </div>
        <div class="data-row">
          <span class="data-row__label">재고 상태</span>
          <span>
            <span class="badge"
                  th:classappend="${product.stockLabel == '품절'} ? 'badge--danger' : (${product.stockLabel == '재고 부족'} ? 'badge--warning' : 'badge--success')"
                  th:text="${product.stockQuantity != null} ? |${product.stockLabel} (${product.stockQuantity}개)| : ${product.stockLabel}">재고 있음</span>
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">픽업 가능일</span>
          <span th:text="${product.preparationDays == 0} ? '당일 픽업 가능' : |주문일로부터 ${product.preparationDays}일 후부터|">픽업 가능일</span>
        </div>
        <div class="stack" th:if="${product.onSale}">
          <div th:if="${product.productType != 'CUSTOM'}">
            <form sec:authorize="isAuthenticated()" th:action="@{/cart/items}" method="post" class="stack">
              <input type="hidden" name="productId" th:value="${product.id}">
              <label class="form-group">
                <span class="form-label">수량</span>
                <input class="form-control" style="max-width:120px" type="number" name="quantity"
                       value="1" min="1" th:max="${product.stockQuantity}" required>
              </label>
              <div class="cluster">
                <button class="btn btn--primary" type="submit">장바구니 담기</button>
                <span class="note">픽업 일시는 선택 상품을 주문할 때 한 번 정합니다.</span>
              </div>
            </form>
            <div sec:authorize="isAnonymous()" class="cluster">
              <a class="btn btn--primary" th:href="@{/login}">로그인 후 장바구니 담기</a>
              <span class="note">장바구니는 로그인 회원에게 저장됩니다.</span>
            </div>
          </div>
          <div class="cluster" th:if="${product.productType == 'CUSTOM'}">
            <a class="btn btn--primary" href="/orders/custom/options">제작 옵션 선택</a>
            <span class="note">옵션 선택 후 제작 요청으로 이어집니다.</span>
          </div>
        </div>
        <div class="panel panel--dashed text-muted" th:if="${!product.onSale}">
          현재 구매할 수 없는 상품입니다.
        </div>
      </div>
    </section>
    <section class="section">
      <h2 class="section-title">후기</h2>
      <div class="cluster">
        <strong style="font-size:24px" th:text="${product.averageRating}">0.0</strong>
        <span class="text-muted" th:text="|(${product.reviewCount}개 후기)|">(0개 후기)</span>
      </div>
      <!-- 공개(VISIBLE) 후기만 나온다. 숨긴 후기는 평점 집계에서도 빠진다. -->
      <div class="stack">
        <article class="panel" th:each="review : ${reviewPage.content}">
          <div class="cluster cluster--between text-muted">
            <span>
              <span th:text="${review.writerNickname}">작성자</span> |
              <span th:text="|종합 ${review.overallRating}점|">종합 5점</span>
              <span th:if="${review.tasteRating != null}" th:text="|· 맛 ${review.tasteRating}|"></span>
              <span th:if="${review.designRating != null}" th:text="|· 디자인 ${review.designRating}|"></span>
              <span th:if="${review.serviceRating != null}" th:text="|· 응대 ${review.serviceRating}|"></span>
            </span>
            <time th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd')}">2026.01.01</time>
          </div>
          <p th:text="${review.content}">후기 내용</p>
          <div class="cluster" th:if="${!#lists.isEmpty(review.imageUrls)}">
            <img class="placeholder-image placeholder-image--sm" style="object-fit:cover"
                 th:each="url : ${review.imageUrls}" th:src="${url}" alt="후기 이미지">
          </div>
          <div class="panel panel--soft" th:if="${review.hasReply()}">
            <strong>사장님 답글</strong>
            <p th:text="${review.replyContent}">답글</p>
          </div>
        </article>
        <p class="text-muted" th:if="${reviewPage.content.isEmpty()}">아직 등록된 후기가 없습니다.</p>
      </div>
      <nav th:if="${reviewPage.totalPages > 1}"
           th:replace="~{fragments/common/pagination :: pagination(${reviewPage}, ${'/products/' + product.id}, '')}"></nav>
    </section>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
