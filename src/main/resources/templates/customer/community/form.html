<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${editing != null} ? '글 수정 | 케이크 쇼핑몰' : '글쓰기 | 케이크 쇼핑몰'">글쓰기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="글쓰기">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <h1 th:text="${editing != null} ? '글 수정' : '글쓰기'">글쓰기</h1>

    <!-- 등록·수정이 같은 폼을 공유한다. editing 모델 유무로 action과 문구만 갈린다. -->
    <form th:action="${editing != null} ? @{|/community/${postId}/edit|} : @{/community}"
          method="post" th:object="${form}">
      <div class="form-group">
        <label class="form-label" for="categoryCode">분류 <span class="required">*</span></label>
        <select class="form-control" id="categoryCode" th:field="*{categoryCode}">
          <option value="">선택하세요</option>
          <option th:each="category : ${categories}"
                  th:value="${category.code}" th:text="${category.name}">후기</option>
        </select>
        <p class="field-error" th:errors="*{categoryCode}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="title">제목 <span class="required">*</span></label>
        <input class="form-control" id="title" type="text" th:field="*{title}"
               placeholder="제목을 입력하세요" maxlength="100">
        <p class="field-error" th:errors="*{title}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="content">내용 <span class="required">*</span></label>
        <textarea class="form-control form-control--textarea" id="content" style="min-height:220px"
                  th:field="*{content}" placeholder="내용을 입력하세요"></textarea>
        <p class="field-error" th:errors="*{content}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="images">사진 첨부</label>
        <!-- 파일 업로드 규칙(확장자·크기·파일명)이 팀 미정이라 확정 전까지 비활성화한다. -->
        <input class="form-control" id="images" type="file" accept="image/*" multiple disabled>
        <p class="form-help">사진 첨부는 준비 중입니다.</p>
      </div>

      <div class="cluster cluster--between section">
        <a class="btn" th:href="${editing != null} ? @{|/community/${postId}|} : @{/community}">취소</a>
        <button class="btn btn--primary" type="submit" th:text="${editing != null} ? '수정' : '등록'">등록</button>
      </div>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
