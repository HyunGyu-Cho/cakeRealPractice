<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('마이페이지 | 케이크 쇼핑몰')}"></th:block>
</head>
<body data-page-title="마이페이지">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container ">
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <h1>마이페이지</h1>
    <div class="layout-sidebar">
      <aside class="panel">
        <strong th:text="${profile.nickname}">홍길동</strong>
        <p class="text-muted" th:text="${profile.email}">example@email.com</p>
        <nav class="stack" style="margin-top:12px">
          <a class="btn btn--block" href="#orders">주문 내역</a>
          <a class="btn btn--block" th:href="@{/chat}">1:1 문의</a>
          <a class="btn btn--block" th:href="@{/mypage/coupons}">보유 쿠폰</a>
          <a class="btn btn--block" th:href="@{/reviews}">내 후기</a>
          <a class="btn btn--block" th:href="@{/mypage/profile}">회원정보 수정</a>
        </nav>
        <hr class="divider">
        <!-- Spring Security 로그아웃은 CSRF 토큰이 필요한 POST다. th:action이 토큰을 자동 삽입한다. -->
        <form th:action="@{/logout}" method="post">
          <button class="btn" type="submit">로그아웃</button>
        </form>
      </aside>
      <div>
      <section class="section">
        <h2 class="section-title">회원 정보</h2>
        <div class="panel">
          <div class="data-row"><span class="data-row__label">이름</span><span th:text="${profile.nickname}">홍길동</span></div>
          <div class="data-row"><span class="data-row__label">이메일</span><span th:text="${profile.email}">example@email.com</span></div>
          <div class="data-row"><span class="data-row__label">전화번호</span><span th:text="${profile.phone}">010-0000-0000</span></div>
          <a class="btn" th:href="@{/mypage/profile}" style="margin-top:8px">정보 수정</a>
        </div>
      </section>
      <div id="orders">
        <section class="section">
          <h2 class="section-title">진행 중인 주문</h2>
          <div class="stack">
            <article class="panel cluster cluster--between" th:each="order : ${orders.ongoingOrders}">
              <div>
                <strong th:text="${order.productSummary}">상품</strong>
                <p class="text-muted">
                  픽업: <span th:text="${#temporals.format(order.pickupAt, 'MM.dd HH:mm')}">-</span>
                  | <span th:text="${order.orderNumber}">ORD-</span>
                </p>
              </div>
              <div class="cluster">
                <span class="badge" th:classappend="${order.statusBadgeClass}"
                      th:text="${order.statusLabel}">상태</span>
                <a class="btn" th:href="@{${order.detailUrl}}">상세</a>
              </div>
            </article>
            <div class="panel panel--soft" th:if="${#lists.isEmpty(orders.ongoingOrders)}">
              <p class="text-muted">진행 중인 주문이 없습니다.</p>
            </div>
          </div>
        </section>
        <section class="section">
          <h2 class="section-title">최근 주문</h2>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>주문번호</th><th>상품명</th><th>금액</th><th>상태</th><th>픽업일</th><th>상세</th></tr></thead>
              <tbody>
                <tr th:each="order : ${orders.recentOrders}">
                  <td th:text="${order.orderNumber}">ORD-</td>
                  <td th:text="${order.productSummary}">상품</td>
                  <td>
                    <span th:if="${order.finalAmount != null}">
                      <span th:text="${#numbers.formatInteger(order.finalAmount, 0, 'COMMA')}">0</span>원
                    </span>
                    <span th:unless="${order.finalAmount != null}">-</span>
                  </td>
                  <td><span class="badge" th:classappend="${order.statusBadgeClass}"
                            th:text="${order.statusLabel}">상태</span></td>
                  <td th:text="${#temporals.format(order.pickupAt, 'MM.dd HH:mm')}">-</td>
                  <td><a class="btn" th:href="@{${order.detailUrl}}">보기</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders.recentOrders)}">
                  <td colspan="6">최근 완료된 주문이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div></div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
