<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="회원가입">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <h1>회원가입</h1>
    <form class="panel" th:action="@{/signup}" th:object="${signupForm}" method="post">
      <section class="section">
        <h2 class="section-title">약관 동의</h2>
        <div class="panel stack terms-panel">
          <label class="choice"><input type="checkbox" th:field="*{termsService}"> [필수] 이용약관 동의</label>
          <p class="form-error" th:errors="*{termsService}"></p>
          <label class="choice"><input type="checkbox" th:field="*{termsPrivacy}"> [필수] 개인정보 처리방침 동의</label>
          <p class="form-error" th:errors="*{termsPrivacy}"></p>
          <label class="choice"><input type="checkbox" th:field="*{marketing}"> [선택] 마케팅 정보 수신 동의</label>
          <hr class="divider">
          <label class="choice"><input type="checkbox" data-check-all> 전체 동의</label>
        </div>
      </section>
      <div class="form-group">
        <label class="form-label" for="email">이메일 <span class="required">*</span></label>
        <input class="form-control" type="email" placeholder="example@email.com" th:field="*{email}">
        <p class="form-error" th:errors="*{email}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호 <span class="required">*</span></label>
        <input class="form-control" type="password" placeholder="8자 이상" autocomplete="new-password" th:field="*{password}">
        <p class="form-error" th:errors="*{password}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="passwordConfirm">비밀번호 확인 <span class="required">*</span></label>
        <input class="form-control" type="password" autocomplete="new-password" th:field="*{passwordConfirm}">
        <p class="form-error" th:errors="*{passwordConfirm}"></p>
        <p class="form-error" th:errors="*{passwordConfirmed}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="nickname">이름 <span class="required">*</span></label>
        <input class="form-control" placeholder="이름(닉네임) 입력" th:field="*{nickname}">
        <p class="form-error" th:errors="*{nickname}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">전화번호 <span class="required">*</span></label>
        <input class="form-control" type="tel" placeholder="010-0000-0000" th:field="*{phone}">
        <p class="form-error" th:errors="*{phone}"></p>
      </div>
      <button class="btn btn--primary btn--block" type="submit">가입하기</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
