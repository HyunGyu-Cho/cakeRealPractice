<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="회원가입">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <h1>회원가입</h1><form class="panel" data-mock-form data-success-url="/login">
      <section class="section"><h2 class="section-title">약관 동의</h2><div class="panel stack terms-panel"><label class="choice"><input type="checkbox" required> [필수] 이용약관 동의</label><label class="choice"><input type="checkbox" required> [필수] 개인정보 처리방침 동의</label><label class="choice"><input type="checkbox"> [선택] 마케팅 정보 수신 동의</label><hr class="divider"><label class="choice"><input type="checkbox" data-check-all> 전체 동의</label></div><p class="note">필수 약관 미동의 시 가입 불가 메시지 표시</p></section>
      <div class="form-group"><label class="form-label" for="signup-email">이메일 <span class="required">*</span></label><div class="cluster"><input class="form-control" id="signup-email" type="email" placeholder="example@email.com" style="flex:1" required><button class="btn" type="button">중복 확인</button></div><p class="form-help">이미 사용 중인 이메일 / 사용 가능한 이메일</p></div>
      <div class="form-group"><label class="form-label" for="signup-password">비밀번호 <span class="required">*</span></label><input class="form-control" id="signup-password" type="password" minlength="8" placeholder="8자 이상, 영문+숫자+특수문자" required><p class="form-help">비밀번호 강도: 약 / 보통 / 강</p></div>
      <div class="form-group"><label class="form-label" for="signup-password-confirm">비밀번호 확인 <span class="required">*</span></label><input class="form-control" id="signup-password-confirm" type="password" required><p class="form-error">비밀번호가 일치하지 않습니다. (오류 예시)</p></div>
      <div class="form-group"><label class="form-label" for="signup-name">이름 <span class="required">*</span></label><input class="form-control" id="signup-name" placeholder="실명 입력" required></div>
      <div class="form-group"><label class="form-label" for="signup-phone">전화번호 <span class="required">*</span></label><input class="form-control" id="signup-phone" type="tel" placeholder="010-0000-0000" required></div>
      <div class="error-box">입력 오류 메시지 영역</div><button class="btn btn--primary btn--block" type="submit">가입하기</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
