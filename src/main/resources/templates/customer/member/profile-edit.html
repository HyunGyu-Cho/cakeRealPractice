<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원정보 수정 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="회원정보 수정">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <h1>회원정보 수정</h1>

    <form th:action="@{/mypage/profile}" th:object="${profileForm}" method="post">
      <section class="section">
        <h2 class="section-title">기본 정보</h2>
        <div class="panel">
          <div class="form-group">
            <label class="form-label" for="nickname">이름 <span class="required">*</span></label>
            <input class="form-control" th:field="*{nickname}">
            <p class="form-error" th:errors="*{nickname}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-email">이메일</label>
            <input class="form-control" id="profile-email" type="email" th:value="${profile.email}" readonly>
            <p class="form-help">이메일 변경 불가</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">전화번호 <span class="required">*</span></label>
            <input class="form-control" type="tel" th:field="*{phone}">
            <p class="form-error" th:errors="*{phone}"></p>
          </div>
          <button class="btn btn--primary" type="submit">기본 정보 저장</button>
        </div>
      </section>
    </form>

    <form th:action="@{/mypage/password}" th:object="${passwordForm}" method="post">
      <section class="section">
        <h2 class="section-title">비밀번호 변경</h2>
        <div class="panel">
          <div class="form-group">
            <label class="form-label" for="currentPassword">현재 비밀번호 <span class="required">*</span></label>
            <input class="form-control" type="password" autocomplete="current-password" th:field="*{currentPassword}">
            <p class="form-error" th:errors="*{currentPassword}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="newPassword">새 비밀번호 <span class="required">*</span></label>
            <input class="form-control" type="password" autocomplete="new-password" th:field="*{newPassword}">
            <p class="form-help">8자 이상</p>
            <p class="form-error" th:errors="*{newPassword}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="newPasswordConfirm">새 비밀번호 확인 <span class="required">*</span></label>
            <input class="form-control" type="password" autocomplete="new-password" th:field="*{newPasswordConfirm}">
            <p class="form-error" th:errors="*{newPasswordConfirm}"></p>
            <p class="form-error" th:errors="*{newPasswordConfirmed}"></p>
          </div>
          <button class="btn btn--primary" type="submit">비밀번호 변경</button>
        </div>
      </section>
    </form>

    <section class="section">
      <h2 class="section-title">회원 탈퇴</h2>
      <div class="panel panel--danger panel--dashed">
        <p class="text-muted">탈퇴 후에는 이 계정으로 다시 로그인할 수 없습니다.</p>
        <form th:action="@{/mypage/withdraw}" method="post">
          <button class="btn btn--danger" type="submit" data-confirm="회원 탈퇴를 진행하시겠습니까?">회원 탈퇴</button>
        </form>
      </div>
    </section>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
