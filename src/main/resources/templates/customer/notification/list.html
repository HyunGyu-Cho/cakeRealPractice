<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>알림 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/webjars/stomp__stompjs/7.3.0/bundles/stomp.umd.min.js}"></script>
  <script defer th:src="@{/js/notification.js}"></script>
</head>
<body data-page-title="알림">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow" data-notification-root
        data-subscribe="/user/queue/notifications">
    <div class="cluster cluster--between">
      <h1>알림</h1>
      <button class="btn" type="button" data-read-all
              th:disabled="${slice.unreadCount() == 0}"
              th:text="${slice.unreadCount() == 0} ? '모두 읽음' : '전체 읽음'">전체 읽음</button>
    </div>
    <p class="form-error" data-notification-error role="alert" hidden></p>

    <div class="stack" data-notification-list>
      <p class="text-muted" data-notification-empty
         th:hidden="${!#lists.isEmpty(slice.content())}">받은 알림이 없습니다.</p>

      <article th:each="item : ${slice.content()}" class="notification-item"
               th:classappend="${item.read()} ? '' : ' is-unread'"
               th:attr="data-notification-id=${item.id()}">
        <div class="cluster" style="align-items:flex-start">
          <span class="notification-dot" aria-hidden="true" th:if="${!item.read()}"></span>
          <div>
            <span class="badge" th:text="${item.typeLabel()}">알림</span>
            <p th:text="${item.content()}">알림 내용</p>
            <time class="text-muted"
                  th:text="${#temporals.format(item.createdAt(), 'MM.dd HH:mm')}"></time>
          </div>
        </div>
        <a class="btn" th:if="${item.targetUrl() != null}"
           th:href="${item.targetUrl()}" data-notification-link>상세</a>
      </article>
    </div>

    <div class="cluster cluster--center section" th:if="${slice.hasNext()}">
      <button class="btn" type="button" data-load-more
              th:attr="data-cursor=${slice.nextCursor()}">더 보기</button>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
