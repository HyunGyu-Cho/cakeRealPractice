<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="장바구니">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <h1>장바구니</h1>
    <div class="cart-layout" data-cart-root>
      <div>
        <section class="panel cart-toolbar">
          <label class="choice" for="cart-check-all"><input id="cart-check-all" type="checkbox" data-cart-check-all> <span data-cart-selection-label>전체 선택 (0개)</span></label>
          <div class="cluster"><button class="btn" type="button" data-cart-delete-selected>선택 삭제</button><button class="btn btn--danger" type="button" data-cart-delete-all>전체 삭제</button></div>
        </section>
        <div class="panel panel--soft cart-warning" data-cart-pickup-warning role="status" hidden>⚠ 선택한 상품의 픽업 일시가 서로 다릅니다. 픽업 일시를 통일하거나 주문을 나누어 진행해주세요.</div>
        <section class="stack cart-items" data-cart-items aria-live="polite"></section>
        <section class="panel panel--dashed cart-empty" data-cart-empty hidden>
          <p>장바구니가 비어 있습니다.</p>
          <a class="btn" href="/products">상품 보러 가기</a>
        </section>
        <div class="cart-continue"><a class="btn" href="/products">← 쇼핑 계속하기</a></div>
      </div>
      <aside class="order-summary cart-summary">
        <h2 class="section-title">주문 요약</h2>
        <div class="data-row"><span class="data-row__label">선택 상품</span><span data-cart-selected-count>0개</span></div>
        <div class="data-row"><span class="data-row__label">총 상품 금액</span><span data-cart-base-total>0원</span></div>
        <div class="data-row"><span class="data-row__label">총 옵션 금액</span><span data-cart-option-total>0원</span></div>
        <div class="data-row cart-summary__total"><span class="data-row__label">예상 결제 금액</span><strong data-cart-total>0원</strong></div>
        <p class="note">쿠폰 할인은 주문서에서 적용됩니다.</p>
        <button class="btn btn--primary btn--block" type="button" data-cart-order>선택 상품 주문하기 (0개)</button>
        <p class="note">비로그인 시 로그인 후 장바구니로 복귀합니다.</p>
        <p class="form-error" data-cart-error role="alert" hidden></p>
      </aside>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
