<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/cart.js}"></script>
</head>
<body data-page-title="장바구니">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <h1>장바구니</h1>

    <section class="panel panel--dashed cart-empty" th:if="${cart.empty}">
      <p>장바구니가 비어 있습니다.</p>
      <a class="btn" th:href="@{/products}">상품 보러 가기</a>
    </section>

    <div class="cart-layout" data-cart-root th:unless="${cart.empty}">
      <div>
        <section class="panel cart-toolbar">
          <label class="choice" for="cart-check-all">
            <input id="cart-check-all" type="checkbox" data-cart-check-all>
            <span data-cart-selection-label>전체 선택 (0개)</span>
          </label>
          <div class="cluster">
            <button class="btn" type="submit" form="cart-selection-form"
                    th:formaction="@{/cart/items/delete-selected}">선택 삭제</button>
            <form th:action="@{/cart/items/delete-all}" method="post">
              <button class="btn btn--danger" type="submit">전체 삭제</button>
            </form>
          </div>
        </section>

        <section class="stack cart-items" aria-live="polite">
          <article class="panel cart-item" th:each="item : ${cart.items}"
                   th:classappend="${!item.selectable} ? 'is-disabled'"
                   th:attr="data-cart-item='',data-unit-price=${item.currentUnitPrice},data-quantity=${item.quantity}">
            <input class="cart-item__check" type="checkbox" name="itemIds"
                   th:value="${item.cartItemId}" form="cart-selection-form"
                   data-cart-item-check th:disabled="${!item.selectable}"
                   th:attr="aria-label=|${item.productName} 선택|">
            <a th:href="@{/products/{id}(id=${item.productId})}">
              <img class="placeholder-image placeholder-image--sm cart-item__image"
                   th:if="${item.imageUrl != null}" th:src="${item.imageUrl}"
                   th:alt="${item.productName}" style="object-fit:cover">
              <span class="placeholder-image placeholder-image--sm cart-item__image"
                    th:if="${item.imageUrl == null}">상품 이미지</span>
            </a>
            <div class="cart-item__body">
              <div class="cluster cluster--between">
                <div>
                  <a class="cart-item__name" th:href="@{/products/{id}(id=${item.productId})}"
                     th:text="${item.productName}">상품명</a>
                  <div class="cluster cart-item__badges">
                    <span class="badge" th:text="${item.productTypeLabel}">유형</span>
                    <span class="badge badge--danger" th:if="${!item.selectable}"
                          th:text="${item.unavailableReason}">주문 불가</span>
                  </div>
                </div>
                <strong th:text="|${#numbers.formatInteger(item.currentTotalPrice, 3, 'COMMA')}원|">0원</strong>
              </div>
              <p class="text-muted"
                 th:text="|현재 판매가 ${#numbers.formatInteger(item.currentUnitPrice, 3, 'COMMA')}원 · 재고 ${item.stockQuantity ?: 0}개|">
                현재 판매가와 재고
              </p>
              <div class="cluster cart-item__bottom">
                <form th:action="@{/cart/items/{id}/quantity(id=${item.cartItemId})}" method="post"
                      class="cluster">
                  <label class="visually-hidden" th:for="|quantity-${item.cartItemId}|">수량</label>
                  <input class="form-control" style="width:80px"
                         th:id="|quantity-${item.cartItemId}|" type="number" name="quantity"
                         min="1" th:max="${item.stockQuantity ?: 1}" th:value="${item.quantity}" required>
                  <button class="btn" type="submit">수량 변경</button>
                </form>
                <form th:action="@{/cart/items/{id}/delete(id=${item.cartItemId})}" method="post">
                  <button class="btn btn--danger" type="submit">삭제</button>
                </form>
              </div>
              <p class="form-error cart-item__error" th:if="${!item.selectable}"
                 th:text="${item.unavailableReason}">주문할 수 없는 상품입니다.</p>
            </div>
          </article>
        </section>

        <div class="cart-continue"><a class="btn" th:href="@{/products}">← 쇼핑 계속하기</a></div>
      </div>

      <aside class="order-summary cart-summary">
        <h2 class="section-title">주문 요약</h2>
        <div class="data-row">
          <span class="data-row__label">장바구니 수량</span>
          <span th:text="|${cart.totalQuantity}개|">0개</span>
        </div>
        <div class="data-row">
          <span class="data-row__label">선택 상품</span>
          <span data-cart-selected-count>0개</span>
        </div>
        <div class="data-row cart-summary__total">
          <span class="data-row__label">예상 결제 금액</span>
          <strong data-cart-total>0원</strong>
        </div>
        <p class="note">최신 판매가 기준이며 쿠폰 할인은 주문서에서 적용됩니다.</p>
        <form id="cart-selection-form" th:action="@{/cart/checkout}" method="post">
          <button class="btn btn--primary btn--block" type="submit" data-cart-order disabled>
            선택 상품 주문하기 (0개)
          </button>
        </form>
        <p class="form-error" data-cart-error role="alert" hidden>상품을 한 개 이상 선택해 주세요.</p>
      </aside>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
