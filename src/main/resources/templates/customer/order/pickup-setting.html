<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('픽업 일시 선택')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--narrow">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1>픽업 일시 선택</h1>
  <div th:if="${checkout != null}">
    <section class="section">
      <h2 class="section-title">선택 상품</h2>
      <article class="panel cluster" th:each="item : ${checkout.items}">
        <img class="placeholder-image placeholder-image--sm" th:if="${item.imageUrl != null}"
             th:src="${item.imageUrl}" th:alt="${item.productName}">
        <div><strong th:text="${item.productName}">상품</strong>
          <p class="text-muted"><span th:text="${item.quantity}">1</span>개 ·
            <span th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}">0</span>원</p>
        </div>
      </article>
    </section>
    <form class="panel section" method="get" th:action="@{/orders/pickup}">
      <label class="form-label" for="pickup-date">픽업 날짜</label>
      <input class="form-control" id="pickup-date" name="pickupDate" type="date"
             th:value="${selectedDate}" th:min="${minimumDate}" th:max="${maximumDate}">
      <button class="btn" type="submit" style="margin-top:8px">가능 시간 조회</button>
      <p class="note">준비 기간 이후부터 오늘 기준 14일 이내에서 선택할 수 있습니다.</p>
    </form>
    <form method="post" th:action="@{/orders/pickup}" th:object="${pickupForm}">
      <section class="section">
        <h2 class="section-title">픽업 시간</h2>
        <div class="panel grid grid--4">
          <label class="choice" th:each="slot : ${slots}">
            <input type="radio" th:field="*{pickupAt}" th:value="${slot}">
            <span th:text="${#temporals.format(slot, 'HH:mm')}">10:00</span>
          </label>
          <p class="note" th:if="${#lists.isEmpty(slots)}">선택한 날짜에는 가능한 슬롯이 없습니다.</p>
        </div>
        <p class="form-error" th:if="${#fields.hasErrors('pickupAt')}" th:errors="*{pickupAt}"></p>
      </section>
      <section class="panel section">
        <div class="data-row"><span class="data-row__label">예상 합계</span>
          <strong><span th:text="${#numbers.formatInteger(checkout.totalAmount, 0, 'COMMA')}">0</span>원</strong>
        </div>
      </section>
      <button class="btn btn--primary btn--block" type="submit">주문서 작성하기</button>
    </form>
  </div>
  <div class="panel" th:unless="${checkout != null}">
    <p>장바구니에서 주문할 상품을 선택하면 픽업 가능한 날짜와 시간이 표시됩니다.</p>
    <a class="btn btn--primary" th:href="@{/cart}">장바구니로 이동</a>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
