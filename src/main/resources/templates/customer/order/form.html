<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('주문서 작성')}"></head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1>주문서 작성</h1>
  <form class="layout-main-aside" method="post" th:if="${checkout != null}"
        th:action="@{/orders/checkout}" th:object="${orderForm}">
    <div class="stack">
      <section><h2 class="section-title">주문 상품</h2>
        <article class="panel" th:each="item : ${checkout.items}">
          <strong th:text="${item.productName}">상품</strong>
          <p class="text-muted"><span th:text="${item.quantity}">1</span>개 ·
            <span th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}">0</span>원</p>
        </article>
        <div class="panel data-row"><span class="data-row__label">픽업 일시</span>
          <strong th:text="${#temporals.format(checkout.pickupAt, 'yyyy.MM.dd HH:mm')}">-</strong></div>
      </section>
      <section class="panel"><h2 class="section-title">주문자·픽업자 정보</h2>
        <div class="grid grid--2">
          <div class="form-group"><label class="form-label" for="ordererName">주문자 이름</label>
            <input class="form-control" id="ordererName" th:field="*{ordererName}">
            <p class="form-error" th:errors="*{ordererName}"></p></div>
          <div class="form-group"><label class="form-label" for="ordererPhone">주문자 연락처</label>
            <input class="form-control" id="ordererPhone" th:field="*{ordererPhone}">
            <p class="form-error" th:errors="*{ordererPhone}"></p></div>
          <div class="form-group"><label class="form-label" for="pickupName">픽업자 이름</label>
            <input class="form-control" id="pickupName" th:field="*{pickupName}">
            <p class="form-error" th:errors="*{pickupName}"></p></div>
          <div class="form-group"><label class="form-label" for="pickupPhone">픽업자 연락처</label>
            <input class="form-control" id="pickupPhone" th:field="*{pickupPhone}">
            <p class="form-error" th:errors="*{pickupPhone}"></p></div>
        </div>
      </section>
      <section class="panel"><label class="form-label" for="requestMessage">픽업 요청사항</label>
        <textarea class="form-control form-control--textarea" id="requestMessage"
                  th:field="*{requestMessage}"></textarea></section>
    </div>
    <aside class="order-summary"><h2 class="section-title">결제 금액</h2>
      <div class="data-row"><span class="data-row__label">상품 금액</span>
        <span><span th:text="${#numbers.formatInteger(checkout.totalAmount, 0, 'COMMA')}">0</span>원</span></div>
      <div class="data-row"><span class="data-row__label">할인</span><span>0원</span></div>
      <div class="data-row"><span class="data-row__label">최종 결제</span>
        <strong><span th:text="${#numbers.formatInteger(checkout.totalAmount, 0, 'COMMA')}">0</span>원</strong></div>
      <button class="btn btn--primary btn--block" type="submit">결제 단계로</button>
    </aside>
  </form>
  <div class="panel" th:unless="${checkout != null}">
    <p>체크아웃 정보가 없습니다. 장바구니에서 다시 시작해 주세요.</p>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
