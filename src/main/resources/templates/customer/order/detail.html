<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('주문 상세')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <div th:if="${order != null}">
    <h1>주문 상세 · <span th:text="${order.orderNumber}">ORD-</span></h1>
    <section class="panel section">
      <div class="data-row"><span class="data-row__label">주문 상태</span><strong th:text="${order.status}">PAID</strong></div>
      <div class="data-row"><span class="data-row__label">주문 일시</span><span th:text="${#temporals.format(order.createdAt, 'yyyy.MM.dd HH:mm')}">-</span></div>
      <div class="data-row"><span class="data-row__label">픽업 일시</span><span th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">-</span></div>
      <div class="data-row"><span class="data-row__label">결제 금액</span>
        <strong><span th:text="${#numbers.formatInteger(order.finalAmount, 0, 'COMMA')}">0</span>원</strong></div>
    </section>
    <section class="section"><h2 class="section-title">주문 상품</h2>
      <article class="panel" th:each="item : ${order.items}">
        <strong th:text="${item.productName}">상품</strong>
        <p><span th:text="${item.quantity}">1</span>개 ·
          <span th:text="${#numbers.formatInteger(item.totalAmount, 0, 'COMMA')}">0</span>원</p>
      </article>
    </section>
    <section class="panel" th:if="${order.cancellable}">
      <p>취소 가능 기한: <span th:text="${#temporals.format(order.cancellationDeadline, 'yyyy.MM.dd HH:mm')}">-</span></p>
      <form method="post" th:action="@{/orders/{id}/cancel(id=${order.id})}" th:object="${cancelForm}">
        <label class="form-label" for="reason">취소 사유</label>
        <textarea class="form-control" id="reason" th:field="*{reason}" required></textarea>
        <button class="btn btn--danger" type="submit" data-confirm="주문을 전액 취소하시겠습니까?">전액 취소·환불</button>
      </form>
    </section>
    <section class="panel" th:if="${order.status == 'CANCELED'}">
      <strong>취소 완료</strong><p th:text="${order.cancelReason}">취소 사유</p>
    </section>
  </div>
  <div class="panel" th:unless="${order != null}"><p>주문 상세 정보가 표시되는 화면입니다.</p></div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
