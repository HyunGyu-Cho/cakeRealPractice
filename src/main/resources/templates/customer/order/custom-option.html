<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 제작 옵션 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="주문 제작 옵션">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <h1>주문 제작 옵션 입력</h1><section class="section"><h2 class="section-title">상품 정보</h2><div class="panel cluster"><div class="placeholder-image placeholder-image--sm">상품 이미지</div><div><strong>레터링 주문 케이크</strong><p class="text-muted">기본 55,000원</p></div></div></section>
    <form data-mock-form data-success-url="/orders/custom/request"><section class="section"><h2 class="section-title">제작 옵션</h2><div class="panel stack">
      <fieldset><legend class="form-label">크기 <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="size" value="1호 (10cm)" data-option-price="0" required> 1호 (10cm)</label><label class="choice"><input type="radio" name="size" value="2호 (15cm)" data-option-price="5000"> 2호 (15cm) +5,000원</label><label class="choice"><input type="radio" name="size" value="3호 (21cm)" data-option-price="10000"> 3호 (21cm) +10,000원</label></div></fieldset>
      <fieldset><legend class="form-label">맛 <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="flavor" value="바닐라" data-option-price="0" required> 바닐라</label><label class="choice"><input type="radio" name="flavor" value="초코" data-option-price="2000"> 초코 +2,000원</label><label class="choice"><input type="radio" name="flavor" value="딸기" data-option-price="2000"> 딸기 +2,000원</label><label class="choice"><input type="radio" name="flavor" value="녹차" data-option-price="3000"> 녹차 +3,000원</label></div></fieldset>
      <fieldset><legend class="form-label">색상 <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="color" value="화이트" data-option-price="0" required> 화이트</label><label class="choice"><input type="radio" name="color" value="아이보리" data-option-price="0"> 아이보리</label><label class="choice"><input type="radio" name="color" value="핑크" data-option-price="2000"> 핑크 +2,000원</label><label class="choice"><input type="radio" name="color" value="민트" data-option-price="2000"> 민트 +2,000원</label></div></fieldset>
      <div class="form-group"><label class="form-label" for="lettering">레터링 문구</label><input class="form-control" id="lettering" maxlength="20" placeholder="예: Happy Birthday OO (20자 이내)"></div><div class="form-group"><label class="form-label" for="custom-note">요청사항</label><textarea class="form-control form-control--textarea" id="custom-note" placeholder="추가 요청사항 (예: 장식 스타일, 특이사항 등)"></textarea></div><div class="form-group"><label class="form-label" for="reference-image">참고 이미지 첨부</label><input class="form-control" id="reference-image" type="file" accept="image/jpeg,image/png"><p class="form-help">JPG, PNG, 최대 5MB</p></div>
    </div></section><section class="section"><h2 class="section-title">픽업 일시 선택</h2><div class="panel grid grid--2"><div class="form-group"><label class="form-label" for="custom-date">픽업 날짜 <span class="required">*</span></label><input class="form-control" id="custom-date" type="date" required></div><div class="form-group"><label class="form-label" for="custom-time">픽업 시간 <span class="required">*</span></label><select class="form-control" id="custom-time" required><option value="">시간 선택</option><option>14:00</option><option>15:00</option></select></div><p class="note">제작 요청 시 필수입니다. 장바구니에는 픽업 일시 없이 담고 나중에 선택할 수 있습니다.</p></div></section>
    <section class="section"><h2 class="section-title">예상 금액</h2><div class="panel"><div class="data-row"><span class="data-row__label">기본 금액</span><span>55,000원</span></div><div class="data-row"><span class="data-row__label">크기 추가</span><span>선택 옵션에 따라 계산</span></div><div class="data-row"><span class="data-row__label">맛 추가</span><span>선택 옵션에 따라 계산</span></div><div class="data-row"><span class="data-row__label">색상 추가</span><span>선택 옵션에 따라 계산</span></div><div class="data-row"><span class="data-row__label">예상 합계</span><strong>55,000원부터</strong></div></div></section><div class="cluster"><button class="btn btn--primary" type="submit" data-custom-request-button>제작 요청하기</button><button class="btn" type="button" data-add-custom-cart>장바구니 담기</button></div></form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
