<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('주문 완료')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--form">
  <section class="panel" style="padding:32px;text-align:center">
    <h1>주문이 완료되었습니다.</h1>
    <div th:if="${order != null}">
      <p class="text-muted">주문번호: <span th:text="${order.orderNumber}">ORD-</span></p>
      <div style="text-align:left">
        <div class="data-row"><span class="data-row__label">상품</span>
          <span th:text="${order.items[0].productName}">상품</span></div>
        <div class="data-row"><span class="data-row__label">결제 금액</span>
          <span><span th:text="${#numbers.formatInteger(order.finalAmount, 0, 'COMMA')}">0</span>원</span></div>
        <div class="data-row"><span class="data-row__label">픽업 일시</span>
          <span th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">-</span></div>
      </div>
      <a class="btn" th:href="@{/orders/{id}(id=${order.id})}">주문 상세 보기</a>
    </div>
    <p th:unless="${order != null}">결제를 완료하면 주문 정보가 표시됩니다.</p>
    <a class="btn btn--primary" th:href="@{/}">메인으로</a>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
