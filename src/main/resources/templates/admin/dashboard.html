<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('대시보드 | 관리자')}"></th:block>
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('dashboard')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('대시보드')}"></header>
    <main class="admin-content">
      <div th:replace="~{fragments/common/alert :: alert}"></div>
      <h1 class="admin-page-title">대시보드</h1>
      <section class="grid grid--4 section">
        <article class="metric-card"><p>오늘 주문</p>
          <strong th:text="|${dashboard.todayOrderCount}건|">0건</strong></article>
        <article class="metric-card"><p>오늘 매출</p>
          <strong th:text="|${#numbers.formatInteger(dashboard.todayNetSalesAmount, 0, 'COMMA')}원|">0원</strong></article>
        <article class="metric-card"><p>승인 대기</p>
          <strong th:text="|${dashboard.underReviewCount}건|">0건</strong></article>
        <article class="metric-card"><p>취소·환불 요청</p>
          <strong th:text="|${dashboard.pendingCancellationCount}건|">0건</strong></article>
      </section>
      <section class="grid grid--3 section">
        <article class="metric-card"><p>제작 중</p>
          <strong th:text="|${dashboard.inProductionCount}건|">0건</strong></article>
        <article class="metric-card"><p>오늘 픽업 예정</p>
          <strong th:text="|${dashboard.todayPickupCount}건|">0건</strong></article>
        <article class="metric-card"><p>재고 부족 상품</p>
          <strong th:text="|${dashboard.lowStockCount}개|">0개</strong></article>
      </section>
      <div class="grid grid--2">
        <section class="section"><h2 class="section-title">최근 주문</h2>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>주문번호</th><th>상품</th><th>상태</th><th>금액</th><th>관리</th></tr></thead>
            <tbody>
            <tr th:each="order : ${dashboard.recentOrders}">
              <td th:text="${order.orderNumber}">-</td>
              <td th:text="${order.productSummary}">-</td>
              <td><span class="badge" th:text="${order.status}">-</span></td>
              <td th:text="|${#numbers.formatInteger(order.finalAmount, 0, 'COMMA')}원|">-</td>
              <td><a class="btn" th:href="@{/admin/orders/{id}(id=${order.id})}">상세</a></td>
            </tr>
            <tr th:if="${dashboard.recentOrders.isEmpty()}">
              <td colspan="5">주문이 없습니다.</td>
            </tr>
            </tbody></table></div>
          <a class="btn section-action" th:href="@{/admin/orders}">전체 주문 보기</a>
        </section>
        <section class="section"><h2 class="section-title">오늘 픽업 일정</h2>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>시간</th><th>주문번호</th><th>상품</th><th>상태</th></tr></thead>
            <tbody>
            <tr th:each="pickup : ${dashboard.todayPickups}">
              <td th:text="${#temporals.format(pickup.pickupAt, 'HH:mm')}">-</td>
              <td th:text="${pickup.orderNumber}">-</td>
              <td th:text="${pickup.productSummary}">-</td>
              <td><span class="badge" th:text="${pickup.status}">-</span></td>
            </tr>
            <tr th:if="${dashboard.todayPickups.isEmpty()}">
              <td colspan="4">오늘 픽업 예정인 주문이 없습니다.</td>
            </tr>
            </tbody></table></div>
        </section>
      </div>
      <div class="grid grid--2">
        <section class="section">
          <h2 class="section-title">재고 부족 상품</h2>
          <p class="note" th:text="|재고 ${dashboard.lowStockThreshold}개 이하인 판매 중 상품|">기준</p>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>상품명</th><th>재고</th><th>조치</th></tr></thead>
            <tbody>
            <tr th:each="product : ${dashboard.lowStockProducts}">
              <td th:text="${product.productName}">-</td>
              <td><span class="badge badge--danger" th:text="|${product.stockQuantity}개|">-</span></td>
              <td><a class="btn" th:href="@{/admin/products/{id}/edit(id=${product.productId})}">재고 수정</a></td>
            </tr>
            <tr th:if="${dashboard.lowStockProducts.isEmpty()}">
              <td colspan="3">재고가 부족한 상품이 없습니다.</td>
            </tr>
            </tbody></table></div>
        </section>
        <section class="section"><h2 class="section-title">처리할 작업</h2>
          <div class="stack">
            <div class="panel cluster cluster--between">
              <span th:text="|제작 승인 대기 ${dashboard.underReviewCount}건|">제작 승인 대기</span>
              <a class="btn" th:href="@{/admin/custom-orders}">처리하기</a>
            </div>
            <div class="panel cluster cluster--between">
              <span th:text="|취소·환불 요청 ${dashboard.pendingCancellationCount}건|">취소·환불 요청</span>
              <a class="btn" th:href="@{/admin/payments}">처리하기</a>
            </div>
            <div class="panel cluster cluster--between">
              <span th:text="|미답변 후기 ${dashboard.unansweredReviewCount}건|">미답변 후기</span>
              <a class="btn" th:href="@{/admin/reviews}">처리하기</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</body></html>
