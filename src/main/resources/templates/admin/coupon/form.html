<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠폰 등록·수정 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('쿠폰 등록·수정')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title" th:text="${editingCouponId == null} ? '쿠폰 등록' : '쿠폰 수정'">쿠폰 등록·수정</h1>
  <form class="admin-form" th:object="${couponForm}" method="post"
        th:action="${editingCouponId == null} ? @{/admin/coupons} : @{|/admin/coupons/${editingCouponId}/edit|}">
    <p class="form-error" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    <section class="section"><h2 class="section-title">기본 정보</h2><div class="panel form-stack">
      <div class="form-group">
        <label for="name">쿠폰명 <span class="required">*</span></label>
        <input class="form-control" th:field="*{name}">
        <p class="form-error" th:errors="*{name}"></p>
      </div>
      <div class="grid grid--2">
        <div class="form-group">
          <label for="discountType">할인 유형 <span class="required">*</span></label>
          <select class="form-control" th:field="*{discountType}">
            <option th:each="type : ${discountTypes}" th:value="${type}" th:text="${type.label()}">정률 할인</option>
          </select>
          <p class="form-error" th:errors="*{discountType}"></p>
        </div>
        <div class="form-group">
          <label for="discountValue">할인 값 <span class="required">*</span></label>
          <input class="form-control" type="number" min="1" th:field="*{discountValue}">
          <p class="form-help">정률은 퍼센트(1~100), 정액은 금액(원)을 입력합니다.</p>
          <p class="form-error" th:errors="*{discountValue}"></p>
          <p class="form-error" th:errors="*{percentageInRange}"></p>
        </div>
      </div>
      <div class="grid grid--2">
        <div class="form-group">
          <label for="minimumOrderAmount">최소 주문 금액 <span class="required">*</span></label>
          <input class="form-control" type="number" min="0" step="1000" th:field="*{minimumOrderAmount}">
          <p class="form-help">0 = 제한 없음</p>
          <p class="form-error" th:errors="*{minimumOrderAmount}"></p>
        </div>
        <div class="form-group">
          <label for="maximumDiscountAmount">최대 할인 금액</label>
          <input class="form-control" type="number" min="1" step="1000" th:field="*{maximumDiscountAmount}">
          <p class="form-help">정률 할인에만 설정합니다. 비우면 상한 없음.</p>
          <p class="form-error" th:errors="*{maximumDiscountAmount}"></p>
          <p class="form-error" th:errors="*{maximumDiscountAllowed}"></p>
        </div>
      </div>
    </div></section>
    <section class="section"><h2 class="section-title">발급 조건</h2><div class="panel grid grid--2">
      <div class="form-group">
        <label for="totalQuantity">발급 수량 <span class="required">*</span></label>
        <input class="form-control" type="number" min="1" th:field="*{totalQuantity}">
        <p class="form-help">이미 발급된 수량보다 적게 줄일 수 없습니다.</p>
        <p class="form-error" th:errors="*{totalQuantity}"></p>
      </div>
      <div class="form-group">
        <label for="startsAt">발급 시작 <span class="required">*</span></label>
        <input class="form-control" type="datetime-local" th:field="*{startsAt}">
        <p class="form-error" th:errors="*{startsAt}"></p>
      </div>
      <div class="form-group">
        <label for="expiresAt">만료 일시 <span class="required">*</span></label>
        <input class="form-control" type="datetime-local" th:field="*{expiresAt}">
        <p class="form-help">만료 시각부터는 사용할 수 없습니다(경계 미포함).</p>
        <p class="form-error" th:errors="*{expiresAt}"></p>
        <p class="form-error" th:errors="*{periodValid}"></p>
      </div>
    </div></section>
    <div class="cluster">
      <button class="btn btn--primary" type="submit">저장</button>
      <a class="btn" th:href="@{/admin/coupons}">목록으로</a>
    </div>
  </form>
</main></div></div>
</body></html>
