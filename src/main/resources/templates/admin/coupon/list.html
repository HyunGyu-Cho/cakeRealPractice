<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>쿠폰 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside><div class="admin-main"><header th:replace="~{fragments/admin/header :: header('쿠폰 관리')}"></header><main class="admin-content">
<div th:replace="~{fragments/admin/mock-notice :: notice}"></div><div class="cluster cluster--between"><h1 class="admin-page-title">쿠폰 관리</h1><button class="btn btn--primary" type="button">+ 쿠폰 등록</button></div><div class="table-wrap section"><table class="data-table"><thead><tr><th>쿠폰명</th><th>할인 유형</th><th>할인값</th><th>최소 주문</th><th>최대 할인</th><th>발급 대상</th><th>기간</th><th>상태</th><th>관리</th></tr></thead><tbody>
<tr><td>첫 주문 쿠폰</td><td>금액 할인</td><td>5,000원</td><td>30,000원</td><td>-</td><td>첫 주문 회원</td><td>~2025.12.31</td><td><span class="badge badge--success">발급 중</span></td><td><div class="cluster"><button class="btn" type="button">수정</button><button class="btn btn--danger" type="button">발급 중지</button></div></td></tr>
<tr><td>10% 할인</td><td>비율 할인</td><td>10%</td><td>20,000원</td><td>10,000원</td><td>전체 회원</td><td>~2025.03.31</td><td><span class="badge badge--success">발급 중</span></td><td><div class="cluster"><button class="btn" type="button">수정</button><button class="btn btn--danger" type="button">발급 중지</button></div></td></tr>
<tr><td>생일 쿠폰</td><td>비율 할인</td><td>15%</td><td>-</td><td>-</td><td>생일 회원</td><td>생일 당월</td><td><span class="badge badge--success">발급 중</span></td><td><div class="cluster"><button class="btn" type="button">수정</button><button class="btn btn--danger" type="button">발급 중지</button></div></td></tr>
</tbody></table></div><section><h2 class="section-title">쿠폰 등록 / 수정</h2><form class="panel" style="max-width:680px"><div class="form-group"><label for="coupon-name">쿠폰명 <span class="required">*</span></label><input class="form-control" id="coupon-name" placeholder="쿠폰 이름 입력" required></div><div class="grid grid--2"><fieldset class="form-group"><legend>할인 유형 <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="discount-type" required> 금액 할인</label><label class="choice"><input type="radio" name="discount-type"> 비율 할인</label></div></fieldset><div class="form-group"><label for="discount-value">할인값 <span class="required">*</span></label><input class="form-control" id="discount-value" placeholder="5000 또는 10 (%)" required></div></div><div class="grid grid--2"><div class="form-group"><label for="minimum-order">최소 주문 금액</label><input class="form-control" id="minimum-order" placeholder="30000 (미입력 시 없음)"></div><div class="form-group"><label for="maximum-discount">최대 할인 금액</label><input class="form-control" id="maximum-discount" placeholder="10000 (비율 할인 시)"></div></div><div class="grid grid--2"><div class="form-group"><label for="coupon-start">시작일 <span class="required">*</span></label><input class="form-control" id="coupon-start" type="date" required></div><div class="form-group"><label for="coupon-end">종료일 <span class="required">*</span></label><input class="form-control" id="coupon-end" type="date" required></div></div><fieldset class="form-group"><legend>발급 대상</legend><div class="choice-list"><label class="choice"><input type="radio" name="coupon-target"> 전체 회원</label><label class="choice"><input type="radio" name="coupon-target"> 첫 주문 회원</label><label class="choice"><input type="radio" name="coupon-target"> 생일 회원</label><label class="choice"><input type="radio" name="coupon-target"> 특정 회원</label></div></fieldset><div class="form-group"><label for="coupon-quantity">발급 수량</label><input class="form-control" id="coupon-quantity" placeholder="100 (미입력 시 무제한)"></div><div class="cluster"><button class="btn btn--primary" type="submit">저장</button><button class="btn" type="reset">취소</button></div></form></section></main></div></div></body></html>
