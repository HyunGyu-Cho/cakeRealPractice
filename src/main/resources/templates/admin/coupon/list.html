<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠폰 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('쿠폰 관리')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <div class="cluster cluster--between">
    <h1 class="admin-page-title">쿠폰 목록</h1>
    <a class="btn btn--primary" th:href="@{/admin/coupons/new}">쿠폰 등록</a>
  </div>
  <div class="table-wrap section"><table class="data-table">
    <thead><tr><th>쿠폰명</th><th>할인 유형</th><th>할인</th><th>최소 주문</th>
      <th>발급</th><th>기간</th><th>상태</th><th>관리</th></tr></thead>
    <tbody>
    <tr th:each="coupon : ${pageResult.content}">
      <td th:text="${coupon.name}">쿠폰명</td>
      <td th:text="${coupon.discountTypeLabel}">할인 유형</td>
      <td th:text="${coupon.discountLabel}">할인</td>
      <td th:text="${coupon.minimumOrderAmount > 0}
                   ? |${#numbers.formatInteger(coupon.minimumOrderAmount, 0, 'COMMA')}원| : '-'">-</td>
      <td th:text="|${coupon.issuedQuantity} / ${coupon.totalQuantity}|">0 / 0</td>
      <td th:text="|${#temporals.format(coupon.startsAt, 'yyyy.MM.dd')} ~ ${#temporals.format(coupon.expiresAt, 'yyyy.MM.dd')}|">기간</td>
      <td>
        <!-- 만료·소진은 저장된 상태가 아니라 파생값이라 상태 배지 옆에 따로 표시한다. -->
        <span class="badge"
              th:classappend="${coupon.status == 'ACTIVE'} ? 'badge--success' : (${coupon.status == 'ENDED'} ? 'badge--danger' : 'badge--warning')"
              th:text="${coupon.statusLabel}">상태</span>
        <span class="badge badge--danger" th:if="${coupon.expired}">기간 만료</span>
        <span class="badge badge--warning" th:if="${coupon.soldOut}">소진</span>
      </td>
      <td><div class="cluster">
        <a class="btn" th:href="@{|/admin/coupons/${coupon.id}/edit|}"
           th:if="${coupon.status != 'ENDED'}">수정</a>
        <a class="btn" th:href="@{|/admin/coupons/${coupon.id}/issue|}"
           th:if="${coupon.status == 'ACTIVE'}">발급</a>
        <form th:action="@{|/admin/coupons/${coupon.id}/status|}" method="post">
          <input type="hidden" name="status" th:value="${coupon.status == 'ACTIVE'} ? 'SUSPENDED' : 'ACTIVE'">
          <button class="btn btn--danger" type="submit" th:if="${coupon.status == 'ACTIVE'}"
                  data-confirm="발급을 중지하시겠습니까?">발급 중지</button>
          <button class="btn" type="submit" th:if="${coupon.status == 'SUSPENDED'}"
                  data-confirm="발급을 재개하시겠습니까?">발급 재개</button>
        </form>
        <form th:action="@{|/admin/coupons/${coupon.id}/status|}" method="post"
              th:if="${coupon.status != 'ENDED'}">
          <input type="hidden" name="status" value="ENDED">
          <button class="btn btn--danger" type="submit"
                  data-confirm="쿠폰을 종료하면 되돌릴 수 없습니다. 계속할까요?">종료</button>
        </form>
      </div></td>
    </tr>
    <tr th:if="${pageResult.content.isEmpty()}">
      <td colspan="8" class="text-muted" style="text-align:center">등록된 쿠폰이 없습니다.</td>
    </tr>
    </tbody>
  </table></div>
  <nav th:replace="~{fragments/common/pagination :: pagination(${pageResult}, '/admin/coupons', ${extraQuery})}"></nav>
</main></div></div>
<script defer th:src="@{/js/app.js}"></script>
<script defer th:src="@{/js/admin-mockup.js}"></script>
</body></html>
