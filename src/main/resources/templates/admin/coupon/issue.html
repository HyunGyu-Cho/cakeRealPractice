<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠폰 발급 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('쿠폰 발급')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title">쿠폰 지정 발급</h1>
  <section class="panel section">
    <div class="data-row"><span class="data-row__label">쿠폰</span>
      <strong th:text="${coupon.name}">쿠폰명</strong></div>
    <div class="data-row"><span class="data-row__label">할인</span>
      <span th:text="${coupon.discountLabel}">할인</span></div>
    <div class="data-row"><span class="data-row__label">발급 현황</span>
      <span th:text="|${coupon.issuedQuantity} / ${coupon.totalQuantity}장|">0 / 0장</span></div>
  </section>

  <form class="filter-form section" method="get" th:action="@{|/admin/coupons/${coupon.id}/issue|}">
    <input class="form-control" name="keyword" placeholder="닉네임 또는 이메일 검색" th:value="${keyword}">
    <button class="btn" type="submit">회원 검색</button>
  </form>

  <form method="post" th:object="${couponIssueForm}"
        th:action="@{|/admin/coupons/${coupon.id}/issue|}">
    <input type="hidden" name="keyword" th:value="${keyword}">
    <p class="form-error" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    <p class="form-error" th:errors="*{memberId}"></p>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>선택</th><th>닉네임</th><th>이메일</th><th>가입일</th></tr></thead>
      <tbody>
      <tr th:each="member : ${members}">
        <td><input type="radio" th:field="*{memberId}" th:value="${member.id}"></td>
        <td th:text="${member.nickname}">닉네임</td>
        <td th:text="${member.email}">이메일</td>
        <td th:text="${#temporals.format(member.createdAt, 'yyyy.MM.dd')}">가입일</td>
      </tr>
      <tr th:if="${#lists.isEmpty(members)}">
        <td colspan="4" class="text-muted" style="text-align:center">
          검색어를 입력해 발급할 회원을 찾아 주세요.</td>
      </tr>
      </tbody>
    </table></div>
    <div class="cluster section">
      <button class="btn btn--primary" type="submit" th:if="${!#lists.isEmpty(members)}">발급</button>
      <a class="btn" th:href="@{/admin/coupons}">목록으로</a>
    </div>
  </form>
</main></div></div>
</body></html>
