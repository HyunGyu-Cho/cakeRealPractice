<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('커뮤니티 관리 | 관리자')}"></th:block>
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('community')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('커뮤니티 관리')}"></header>
    <main class="admin-content">
      <div th:replace="~{fragments/common/alert :: alert}"></div>
      <h1 class="admin-page-title">커뮤니티 관리</h1>

      <form class="admin-toolbar" method="get" th:action="@{/admin/community}">
        <input class="form-control" name="writer" aria-label="작성자 검색" placeholder="작성자 검색"
               th:value="${currentWriter}">
        <input class="form-control" name="title" aria-label="제목 검색" placeholder="제목 검색"
               th:value="${currentTitle}">
        <select class="form-control" name="category" aria-label="분류">
          <option value="">분류 전체</option>
          <option th:each="c : ${categories}" th:value="${c.code}" th:text="${c.name}"
                  th:selected="${currentCategory == c.code}">후기</option>
        </select>
        <select class="form-control" name="status" aria-label="상태">
          <option value="">상태 전체</option>
          <option value="ACTIVE"  th:selected="${currentStatus == 'ACTIVE'}">정상</option>
          <option value="BLOCKED" th:selected="${currentStatus == 'BLOCKED'}">제재됨</option>
          <option value="DELETED" th:selected="${currentStatus == 'DELETED'}">삭제됨</option>
        </select>
        <button class="btn" type="submit">검색</button>
      </form>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>번호</th><th>분류</th><th>제목</th><th>작성자</th><th>작성일</th><th>상태</th><th>관리</th></tr>
          </thead>
          <tbody>
            <tr th:each="post : ${pageResult.content}" th:styleappend="${post.status != 'ACTIVE'} ? 'opacity:.6'">
              <td th:text="${post.id}">1</td>
              <td th:text="${post.categoryName}">후기</td>
              <td>
                <a th:if="${post.status == 'ACTIVE'}" th:href="@{|/community/${post.id}|}" th:text="${post.title}">제목</a>
                <span class="note" th:unless="${post.status == 'ACTIVE'}" th:text="${post.title}">제목</span>
              </td>
              <td th:text="${post.nickname}">작성자</td>
              <td th:text="${post.createdDate}">2026.07.24</td>
              <td><span class="badge"
                        th:classappend="${post.status == 'ACTIVE'} ? 'badge--success' : (${post.status == 'BLOCKED'} ? 'badge--danger' : '')"
                        th:text="${post.statusLabel}">정상</span></td>
              <td><a class="btn" th:href="@{|/admin/community/${post.id}|}">상세보기</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pageResult.content)}">
              <td colspan="7" class="text-muted">조건에 맞는 게시글이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav th:replace="~{fragments/common/pagination :: pagination(
          ${pageResult}, '/admin/community', ${extraQuery})}"></nav>

      <p class="note">제재된 게시글은 고객 화면에서 열람이 차단됩니다. 제재·해제는 상세 화면에서 사유와 함께 처리합니다.</p>
    </main>
  </div>
</div>
</body>
</html>
