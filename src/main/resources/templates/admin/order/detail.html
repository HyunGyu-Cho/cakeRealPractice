<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('주문 상세')}"></th:block>
</head>
<body><div class="admin-layout">
<aside th:replace="~{fragments/admin/sidebar :: sidebar('orders')}"></aside>
<div class="admin-main"><header th:replace="~{fragments/admin/header :: header('주문 상세')}"></header>
<main class="admin-content">
  <div th:if="${order != null}">
    <h1 class="admin-page-title" th:text="${order.orderNumber}">ORD-</h1>
    <section class="panel grid grid--2">
      <div class="data-row"><span class="data-row__label">상태</span><strong th:text="${order.status}">PAID</strong></div>
      <div class="data-row"><span class="data-row__label">픽업 일시</span><span th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">-</span></div>
      <div class="data-row"><span class="data-row__label">주문자</span><span th:text="${order.ordererName + ' / ' + order.ordererPhone}">-</span></div>
      <div class="data-row"><span class="data-row__label">픽업자</span><span th:text="${order.pickupName + ' / ' + order.pickupPhone}">-</span></div>
      <div class="data-row"><span class="data-row__label">결제 금액</span><strong th:text="${#numbers.formatInteger(order.finalAmount, 0, 'COMMA') + '원'}">0원</strong></div>
      <div class="data-row"><span class="data-row__label">요청사항</span><span th:text="${order.requestMessage ?: '-'}">-</span></div>
    </section>
    <section><h2 class="section-title">상품</h2><article class="panel" th:each="item : ${order.items}">
      <strong th:text="${item.productName}">상품</strong>
      <p th:text="${item.quantity + '개 / ' + #numbers.formatInteger(item.totalAmount, 0, 'COMMA') + '원'}">-</p>
    </article></section>
  </div>
  <p class="panel" th:unless="${order != null}">주문 상세 데이터가 없습니다.</p>
</main></div></div></body></html>
