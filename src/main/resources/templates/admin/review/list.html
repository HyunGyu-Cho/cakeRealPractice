<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <th:block th:replace="~{fragments/common/head :: head('후기 관리 | 관리자')}"></th:block>
</head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('reviews')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('후기 관리')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title">후기 관리</h1>
  <form class="admin-toolbar filter-form" method="get" th:action="@{/admin/reviews}">
    <input class="form-control" name="keyword" aria-label="상품명 검색" placeholder="상품명 검색"
           th:value="${search.keyword}">
    <select class="form-control" name="status" aria-label="노출 상태">
      <option value="">노출 전체</option>
      <option th:each="option : ${reviewStatuses}" th:value="${option}"
              th:text="${option.label()}"
              th:selected="${search.normalizedStatus == option.name()}">공개</option>
    </select>
    <select class="form-control" name="rating" aria-label="평점">
      <option value="">평점 전체</option>
      <option th:each="score : ${#numbers.sequence(5, 1)}" th:value="${score}"
              th:text="|${score}점|" th:selected="${search.normalizedRating == score}">5점</option>
    </select>
    <button class="btn" type="submit">검색</button>
  </form>

  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>작성자</th><th>상품명</th><th>평점</th><th>내용</th><th>답글</th>
      <th>작성일</th><th>노출</th><th>관리</th></tr></thead>
    <tbody>
    <tr th:each="review : ${pageResult.content}">
      <td th:text="${review.writerNickname}">작성자</td>
      <td><a th:href="@{|/products/${review.productId}|}" th:text="${review.productName}">상품명</a></td>
      <td th:text="|${review.overallRating}점|">5점</td>
      <td th:text="${review.content}">내용</td>
      <td>
        <!-- 후기당 답글 1개라 등록과 수정이 같은 폼이다(uk_review_replies_review). -->
        <form th:action="@{|/admin/reviews/${review.id}/reply|}" method="post" class="stack">
          <textarea class="form-control form-control--textarea" name="content" rows="2"
                    placeholder="답글을 입력하세요" th:text="${review.replyContent}"></textarea>
          <button class="btn" type="submit"
                  th:text="${review.replyContent == null} ? '답글 등록' : '답글 수정'">답글 등록</button>
        </form>
      </td>
      <td th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd')}">작성일</td>
      <td>
        <span class="badge" th:classappend="${review.hidden} ? 'badge--danger' : 'badge--success'"
              th:text="${review.statusLabel}">공개</span>
      </td>
      <td>
        <!-- 후기 삭제는 작성자만 할 수 있다. 관리자는 숨김으로 노출만 막는다(스펙 6장). -->
        <form th:action="@{|/admin/reviews/${review.id}/status|}" method="post">
          <input type="hidden" name="status" th:value="${review.hidden} ? 'VISIBLE' : 'HIDDEN'">
          <button class="btn btn--danger" type="submit" th:unless="${review.hidden}"
                  data-confirm="이 후기를 숨기시겠습니까? 상품 평점 집계에서도 빠집니다.">숨김</button>
          <button class="btn" type="submit" th:if="${review.hidden}"
                  data-confirm="다시 공개하시겠습니까?">공개</button>
        </form>
      </td>
    </tr>
    <tr th:if="${pageResult.content.isEmpty()}">
      <td colspan="8" class="text-muted" style="text-align:center">조건에 맞는 후기가 없습니다.</td>
    </tr>
    </tbody>
  </table></div>
  <nav th:replace="~{fragments/common/pagination :: pagination(${pageResult}, '/admin/reviews', ${extraQuery})}"></nav>
</main></div></div>
</body></html>
