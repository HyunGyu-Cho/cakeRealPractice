<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('매장 정보 관리 | 관리자')}"></th:block>
  <script defer th:src="@{/js/store-admin.js}"></script>
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('store')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('매장 정보 관리')}"></header>
    <main class="admin-content">

    <h1 class="admin-page-title">매장 정보 관리</h1>

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <!-- 작업 흐름 1: @Valid 오류는 redirect하지 않고 같은 form 객체를 다시 렌더한다. -->
    <form class="admin-form" th:action="@{/admin/store}" th:object="${storeForm}" method="post"
          enctype="multipart/form-data">
      <div class="alert alert--error" th:if="${#fields.hasAnyErrors()}">
        <strong>입력 내용을 확인해 주세요.</strong>
        <ul>
          <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
        </ul>
      </div>

      <section class="section">
        <h2 class="section-title">기본 정보</h2>
        <div class="panel form-stack">
          <div class="form-group">
            <label for="name">매장명 <span class="required">*</span></label>
            <input id="name" class="form-control" th:field="*{name}" maxlength="100">
            <p class="field-error" th:errors="*{name}"></p>
          </div>
          <div class="form-group">
            <label for="description">매장 소개</label>
            <textarea id="description" class="form-control form-control--textarea"
                      th:field="*{description}" maxlength="1000"></textarea>
            <p class="field-error" th:errors="*{description}"></p>
          </div>
          <div class="form-group">
            <label for="address">주소 <span class="required">*</span></label>
            <input id="address" class="form-control" th:field="*{address}" maxlength="255">
            <p class="field-error" th:errors="*{address}"></p>
          </div>
          <div class="form-group">
            <label for="phone">연락처 <span class="required">*</span></label>
            <input id="phone" class="form-control" th:field="*{phone}" maxlength="30"
                   placeholder="02-1234-5678">
            <p class="field-error" th:errors="*{phone}"></p>
          </div>
          <div class="form-group">
            <label for="image">매장 사진</label>
            <div class="store-image-field">
              <img th:if="${currentImageUrl}" th:src="${currentImageUrl}" alt="현재 매장 사진"
                   class="store-image-preview">
              <div th:unless="${currentImageUrl}" class="placeholder-image placeholder-image--sm">등록된 사진 없음</div>
              <input id="image" class="form-control" type="file" name="image" accept="image/*">
            </div>
            <p class="form-help">JPG·PNG 등 이미지 파일 1장 (최대 5MB). 새 사진을 선택하면 기존 사진을 대체합니다.</p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">영업시간</h2>
        <div class="panel form-stack">
          <div class="grid grid--2">
            <fieldset class="form-fieldset">
              <legend>평일 영업시간</legend>
              <div class="time-range">
                <div class="time-input-with-picker">
                  <input type="hidden" th:field="*{weekdayOpenTime}">
                  <input class="form-control time-display" type="text" inputmode="numeric"
                         placeholder="예: 오전 10:00" aria-label="평일 영업 시작 시간">
                  <button class="btn btn--icon" type="button" aria-label="평일 영업 시작 시간 선택">🕒</button>
                  <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="평일 영업 시작 시간 선택">
                </div>
                <span>~</span>
                <div class="time-input-with-picker">
                  <input type="hidden" th:field="*{weekdayCloseTime}">
                  <input class="form-control time-display" type="text" inputmode="numeric"
                         placeholder="예: 오후 8:00" aria-label="평일 영업 종료 시간">
                  <button class="btn btn--icon" type="button" aria-label="평일 영업 종료 시간 선택">🕒</button>
                  <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="평일 영업 종료 시간 선택">
                </div>
              </div>
            </fieldset>
            <fieldset class="form-fieldset">
              <legend>주말 영업시간</legend>
              <div class="time-range">
                <div class="time-input-with-picker">
                  <input type="hidden" th:field="*{weekendOpenTime}">
                  <input class="form-control time-display" type="text" inputmode="numeric"
                         placeholder="예: 오전 10:00" aria-label="주말 영업 시작 시간">
                  <button class="btn btn--icon" type="button" aria-label="주말 영업 시작 시간 선택">🕒</button>
                  <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="주말 영업 시작 시간 선택">
                </div>
                <span>~</span>
                <div class="time-input-with-picker">
                  <input type="hidden" th:field="*{weekendCloseTime}">
                  <input class="form-control time-display" type="text" inputmode="numeric"
                         placeholder="예: 오후 8:00" aria-label="주말 영업 종료 시간">
                  <button class="btn btn--icon" type="button" aria-label="주말 영업 종료 시간 선택">🕒</button>
                  <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="주말 영업 종료 시간 선택">
                </div>
              </div>
            </fieldset>
          </div>
          <fieldset class="form-fieldset">
            <legend>정기 휴무일</legend>
            <div class="choice-list">
              <label class="choice" th:each="day : ${dayOptions}">
                <input type="checkbox" th:field="*{closedDays}" th:value="${day.value}">
                <span th:text="${day.label}">월</span>
              </label>
            </div>
          </fieldset>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">픽업 정보</h2>
        <div class="panel form-stack">
          <div class="form-group">
            <label for="pickupPlace">픽업 장소 <span class="required">*</span></label>
            <input id="pickupPlace" class="form-control" th:field="*{pickupPlace}" maxlength="255">
            <p class="field-error" th:errors="*{pickupPlace}"></p>
          </div>
          <div class="grid grid--2">
            <div class="form-group">
              <label for="pickupStartTimeInput">픽업 시작 시간</label>
              <div class="time-input-with-picker">
                <input type="hidden" th:field="*{pickupStartTime}">
                <input id="pickupStartTimeInput" class="form-control time-display" type="text" inputmode="numeric"
                       placeholder="예: 오전 10:00" aria-label="픽업 시작 시간">
                <button class="btn btn--icon" type="button" aria-label="픽업 시작 시간 선택">🕒</button>
                <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="픽업 시작 시간 선택">
              </div>
              <p class="field-error" th:errors="*{pickupStartTime}"></p>
            </div>
            <div class="form-group">
              <label for="pickupEndTimeInput">픽업 종료 시간</label>
              <div class="time-input-with-picker">
                <input type="hidden" th:field="*{pickupEndTime}">
                <input id="pickupEndTimeInput" class="form-control time-display" type="text" inputmode="numeric"
                       placeholder="예: 오후 6:00" aria-label="픽업 종료 시간">
                <button class="btn btn--icon" type="button" aria-label="픽업 종료 시간 선택">🕒</button>
                <input class="time-picker-proxy" type="time" lang="en-GB" tabindex="-1" aria-label="픽업 종료 시간 선택">
              </div>
              <p class="field-error" th:errors="*{pickupEndTime}"></p>
            </div>
          </div>
          <div class="form-group">
            <label for="pickupIntervalMinutes">픽업 시간 간격</label>
            <select id="pickupIntervalMinutes" class="form-control" th:field="*{pickupIntervalMinutes}">
              <option value="30">30분 단위</option>
              <option value="60">1시간 단위</option>
            </select>
            <p class="field-error" th:errors="*{pickupIntervalMinutes}"></p>
          </div>
        </div>
      </section>

      <button class="btn btn--primary" type="submit">매장 정보 저장</button>
    </form>

    <!-- 작업 흐름 2: 반복 가능한 특정 휴무일은 매장 수정과 별도 명령으로 관리한다. -->
    <section class="section holiday-section">
      <h2 class="section-title">특정 휴무일</h2>
      <div class="panel form-stack">
        <form class="holiday-form" th:action="@{/admin/store/holidays}"
              th:object="${holidayForm}" method="post">
          <div class="form-group">
            <label for="holidayDate">날짜</label>
            <input id="holidayDate" class="form-control" type="date" th:field="*{holidayDate}">
            <p class="field-error" th:errors="*{holidayDate}"></p>
          </div>
          <div class="form-group holiday-form__reason">
            <label for="reason">사유</label>
            <input id="reason" class="form-control" th:field="*{reason}" maxlength="100"
                   placeholder="예: 설 연휴">
            <p class="field-error" th:errors="*{reason}"></p>
          </div>
          <button class="btn" type="submit">휴무일 추가</button>
        </form>

        <div class="empty-state" th:if="${#lists.isEmpty(holidays)}">등록된 향후 특정 휴무일이 없습니다.</div>
        <div class="holiday-list" th:unless="${#lists.isEmpty(holidays)}">
          <div class="holiday-item" th:each="holiday : ${holidays}">
            <div>
              <strong th:text="${#temporals.format(holiday.holidayDate, 'yyyy.MM.dd')}">2026.01.01</strong>
              <span class="note" th:text="${holiday.reason}">신정</span>
            </div>
            <form th:action="@{/admin/store/holidays/{id}/delete(id=${holiday.id})}" method="post">
              <button class="btn btn--danger" type="submit">삭제</button>
            </form>
          </div>
        </div>
      </div>
    </section>
    </main>
  </div>
</div>
</body>
</html>
