<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('products')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('상품 관리')}"></header><main class="admin-content">
  <div th:replace="~{fragments/admin/mock-notice :: notice}"></div>
  <h1 class="admin-page-title">상품 목록</h1>
  <div class="admin-toolbar"><form class="filter-form" method="get" th:action="@{/admin/products}"><input class="form-control" name="keyword" placeholder="상품명 검색"><select class="form-control" name="type"><option>유형 전체</option><option>일반 케이크</option><option>주문 제작</option></select><select class="form-control" name="status"><option>판매 상태 전체</option><option>판매 중</option><option>판매 중지</option></select><select class="form-control" name="stock"><option>재고 전체</option><option>재고 있음</option><option>품절</option></select><button class="btn" type="submit">검색</button></form><a class="btn btn--primary" th:href="@{/admin/products/new}">상품 등록 화면</a></div>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>이미지</th><th>상품명</th><th>유형</th><th>가격</th><th>재고</th><th>판매 상태</th><th>등록일</th><th>관리</th></tr></thead><tbody>
    <tr><td><div class="placeholder-image placeholder-image--sm">이미지</div></td><td>딸기 생크림 케이크</td><td>일반</td><td>35,000원</td><td>12개</td><td><span class="badge badge--success">판매 중</span></td><td>2024.12.01</td><td><div class="cluster"><a class="btn" th:href="@{/admin/products/1/edit}">수정 화면</a><button class="btn btn--danger" type="button" data-confirm="판매를 중지하시겠습니까?">중지</button><button class="btn btn--danger" type="button" data-confirm="상품을 삭제하시겠습니까?">삭제</button></div></td></tr>
    <tr><td><div class="placeholder-image placeholder-image--sm">이미지</div></td><td>레터링 주문 케이크</td><td>주문 제작</td><td>55,000원</td><td>-</td><td><span class="badge badge--success">판매 중</span></td><td>2024.11.15</td><td><div class="cluster"><a class="btn" th:href="@{/admin/products/2/edit}">수정 화면</a><button class="btn btn--danger" type="button" data-confirm="판매를 중지하시겠습니까?">중지</button><button class="btn btn--danger" type="button" data-confirm="상품을 삭제하시겠습니까?">삭제</button></div></td></tr>
    <tr><td><div class="placeholder-image placeholder-image--sm">이미지</div></td><td>당일 픽업 세트</td><td>당일 픽업</td><td>28,000원</td><td>2개</td><td><span class="badge badge--warning">재고 부족</span></td><td>2024.10.20</td><td><div class="cluster"><a class="btn" th:href="@{/admin/products/3/edit}">수정 화면</a><button class="btn btn--danger" type="button" data-confirm="판매를 중지하시겠습니까?">중지</button><button class="btn btn--danger" type="button" data-confirm="상품을 삭제하시겠습니까?">삭제</button></div></td></tr>
    <tr><td><div class="placeholder-image placeholder-image--sm">이미지</div></td><td>마카롱 케이크</td><td>시즌</td><td>38,000원</td><td>0개</td><td><span class="badge badge--danger">품절</span></td><td>2024.09.10</td><td><div class="cluster"><a class="btn" th:href="@{/admin/products/4/edit}">수정 화면</a><button class="btn btn--danger" type="button" data-confirm="판매를 중지하시겠습니까?">중지</button><button class="btn btn--danger" type="button" data-confirm="상품을 삭제하시겠습니까?">삭제</button></div></td></tr>
  </tbody></table></div>
</main></div></div></body></html>
