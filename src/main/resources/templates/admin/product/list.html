<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('products')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('상품 관리')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title">상품 목록</h1>
  <div class="admin-toolbar">
    <form class="filter-form" method="get" th:action="@{/admin/products}">
      <input class="form-control" name="keyword" placeholder="상품명 검색" th:value="${search.keyword}">
      <select class="form-control" name="type">
        <option value="">유형 전체</option>
        <option value="GENERAL" th:selected="${search.normalizedType == 'GENERAL'}">일반 케이크</option>
        <option value="CUSTOM" th:selected="${search.normalizedType == 'CUSTOM'}">주문 제작</option>
        <option value="SAME_DAY" th:selected="${search.normalizedType == 'SAME_DAY'}">당일 픽업</option>
        <option value="SEASON" th:selected="${search.normalizedType == 'SEASON'}">시즌 상품</option>
      </select>
      <select class="form-control" name="status">
        <option value="">판매 상태 전체</option>
        <option value="ACTIVE" th:selected="${search.normalizedStatus == 'ACTIVE'}">판매 중</option>
        <option value="INACTIVE" th:selected="${search.normalizedStatus == 'INACTIVE'}">판매 중지</option>
      </select>
      <select class="form-control" name="stock">
        <option value="">재고 전체</option>
        <option value="IN_STOCK" th:selected="${search.normalizedStock == 'IN_STOCK'}">재고 있음</option>
        <option value="SOLD_OUT" th:selected="${search.normalizedStock == 'SOLD_OUT'}">품절</option>
      </select>
      <button class="btn" type="submit">검색</button>
    </form>
    <a class="btn btn--primary" th:href="@{/admin/products/new}">상품 등록</a>
  </div>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>이미지</th><th>상품명</th><th>유형</th><th>가격</th><th>재고</th><th>판매 상태</th><th>등록일</th><th>관리</th></tr></thead>
    <tbody>
    <tr th:each="product : ${pageResult.content}">
      <td>
        <img class="placeholder-image placeholder-image--sm" th:if="${product.imageUrl != null}"
             th:src="${product.imageUrl}" th:alt="${product.name}" style="object-fit:cover">
        <div class="placeholder-image placeholder-image--sm" th:if="${product.imageUrl == null}">이미지</div>
      </td>
      <td th:text="${product.name}">상품명</td>
      <td th:text="${product.productTypeLabel}">유형</td>
      <td th:text="|${#numbers.formatInteger(product.basePrice, 3, 'COMMA')}원|">0원</td>
      <td th:text="${product.stockQuantity != null} ? |${product.stockQuantity}개| : '-'">-</td>
      <td>
        <span class="badge" th:if="${product.status == 'INACTIVE'}" th:classappend="'badge--danger'" th:text="${product.statusLabel}">판매 중지</span>
        <span class="badge" th:if="${product.status == 'ACTIVE'}"
              th:classappend="${product.stockLabel == '품절'} ? 'badge--danger' : (${product.stockLabel == '재고 부족'} ? 'badge--warning' : 'badge--success')"
              th:text="${product.stockLabel == '재고 있음' or product.stockLabel == '주문 가능'} ? ${product.statusLabel} : ${product.stockLabel}">판매 중</span>
      </td>
      <td th:text="${#temporals.format(product.createdAt, 'yyyy.MM.dd')}">등록일</td>
      <td><div class="cluster">
        <a class="btn" th:href="@{|/admin/products/${product.id}/edit|}">수정</a>
        <!-- 하드 삭제는 하지 않는다(주문 스냅샷·FK 보존) — 판매 중지/재개 토글만 제공 -->
        <form th:action="@{|/admin/products/${product.id}/status|}" method="post">
          <button class="btn btn--danger" th:if="${product.status == 'ACTIVE'}" type="submit"
                  data-confirm="판매를 중지하시겠습니까?">중지</button>
          <button class="btn" th:if="${product.status == 'INACTIVE'}" type="submit"
                  data-confirm="판매를 재개하시겠습니까?">재개</button>
        </form>
      </div></td>
    </tr>
    <tr th:if="${pageResult.content.isEmpty()}">
      <td colspan="8" class="text-muted" style="text-align:center">조건에 맞는 상품이 없습니다.</td>
    </tr>
    </tbody>
  </table></div>
  <nav th:replace="~{fragments/common/pagination :: pagination(${pageResult}, '/admin/products', ${extraQuery})}"></nav>
</main></div></div>
<script defer th:src="@{/js/app.js}"></script>
<script defer th:src="@{/js/admin-mockup.js}"></script>
</body></html>
