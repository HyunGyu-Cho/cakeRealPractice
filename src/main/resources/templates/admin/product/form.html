<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록·수정 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('products')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('상품 등록·수정')}"></header><main class="admin-content">
  <div th:replace="~{fragments/admin/mock-notice :: notice}"></div>
  <h1 class="admin-page-title">상품 등록·수정</h1>
  <div class="admin-form">
    <section class="section"><h2 class="section-title">기본 정보</h2><div class="panel form-stack"><div class="form-group"><label>상품명</label><input class="form-control" value="딸기 생크림 케이크"></div><div class="grid grid--2"><div class="form-group"><label>상품 유형</label><select class="form-control"><option>일반 케이크</option><option>주문 제작</option><option>당일 픽업</option></select></div><div class="form-group"><label>판매 가격</label><input class="form-control" type="number" value="35000"></div></div><div class="form-group"><label>상품 설명</label><textarea class="form-control form-control--textarea">신선한 딸기와 부드러운 생크림으로 만든 케이크입니다.</textarea></div></div></section>
    <section class="section"><h2 class="section-title">판매·재고</h2><div class="panel grid grid--2"><div class="form-group"><label>판매 상태</label><select class="form-control"><option>판매 중</option><option>판매 중지</option></select></div><div class="form-group"><label>재고</label><input class="form-control" type="number" value="12"></div></div></section>
    <div class="cluster"><button class="btn btn--primary" type="button" disabled>백엔드 연결 후 저장</button><a class="btn" th:href="@{/admin/products}">목록으로</a></div>
  </div>
</main></div></div></body></html>
