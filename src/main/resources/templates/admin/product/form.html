<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록·수정 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('products')}"></aside><div class="admin-main">
  <header th:replace="~{fragments/admin/header :: header('상품 등록·수정')}"></header><main class="admin-content">
  <div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title" th:text="${editingProductId == null} ? '상품 등록' : '상품 수정'">상품 등록·수정</h1>
  <form class="admin-form" th:object="${productForm}" method="post" enctype="multipart/form-data"
        th:action="${editingProductId == null} ? @{/admin/products} : @{|/admin/products/${editingProductId}/edit|}">
    <section class="section"><h2 class="section-title">기본 정보</h2><div class="panel form-stack">
      <div class="form-group">
        <label for="name">상품명 <span class="required">*</span></label>
        <input class="form-control" th:field="*{name}">
        <p class="form-error" th:errors="*{name}"></p>
      </div>
      <div class="grid grid--2">
        <div class="form-group">
          <label for="productType">상품 유형 <span class="required">*</span></label>
          <select class="form-control" th:field="*{productType}">
            <option th:each="type : ${productTypes}" th:value="${type}" th:text="${type.label()}">일반 케이크</option>
          </select>
          <p class="form-help">주문 제작 상품은 재고 없이 등록됩니다.</p>
          <p class="form-error" th:errors="*{productType}"></p>
        </div>
        <div class="form-group">
          <label for="basePrice">판매 가격 <span class="required">*</span></label>
          <input class="form-control" type="number" min="0" step="100" th:field="*{basePrice}">
          <p class="form-error" th:errors="*{basePrice}"></p>
        </div>
      </div>
      <div class="form-group">
        <label for="description">상품 설명</label>
        <textarea class="form-control form-control--textarea" th:field="*{description}"></textarea>
        <p class="form-error" th:errors="*{description}"></p>
      </div>
      <div class="form-group">
        <label for="image">대표 이미지</label>
        <img th:if="${currentImageUrl != null}" th:src="${currentImageUrl}" alt="현재 대표 이미지"
             class="placeholder-image placeholder-image--sm" style="object-fit:cover">
        <input class="form-control" id="image" type="file" name="image" accept="image/*">
        <p class="form-help">새 파일을 선택할 때만 교체됩니다.</p>
      </div>
    </div></section>
    <section class="section"><h2 class="section-title">판매·재고</h2><div class="panel grid grid--2">
      <div class="form-group">
        <label for="status">판매 상태 <span class="required">*</span></label>
        <select class="form-control" th:field="*{status}">
          <option th:each="statusOption : ${productStatuses}" th:value="${statusOption}" th:text="${statusOption.label()}">판매 중</option>
        </select>
        <p class="form-error" th:errors="*{status}"></p>
      </div>
      <div class="form-group">
        <label for="stockQuantity">재고</label>
        <input class="form-control" type="number" min="0" th:field="*{stockQuantity}">
        <p class="form-help">주문 제작 상품은 비워 둡니다.</p>
        <p class="form-error" th:errors="*{stockQuantity}"></p>
        <p class="form-error" th:errors="*{stockProvided}"></p>
      </div>
      <div class="form-group">
        <label for="preparationDays">픽업 준비일 <span class="required">*</span></label>
        <input class="form-control" type="number" min="0" max="60" th:field="*{preparationDays}">
        <p class="form-help">0 = 당일 픽업 가능. 고객 화면의 "픽업 가능 상품만" 필터 기준입니다.</p>
        <p class="form-error" th:errors="*{preparationDays}"></p>
      </div>
    </div></section>
    <div class="cluster">
      <button class="btn btn--primary" type="submit">저장</button>
      <a class="btn" th:href="@{/admin/products}">목록으로</a>
    </div>
  </form>
</main></div></div>
<script defer th:src="@{/js/app.js}"></script>
</body></html>
