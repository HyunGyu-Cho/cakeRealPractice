<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('픽업 처리')}"></th:block>
</head>
<body><div class="admin-layout">
<aside th:replace="~{fragments/admin/sidebar :: sidebar('fulfillment')}"></aside>
<div class="admin-main"><header th:replace="~{fragments/admin/header :: header('픽업 처리')}"></header>
<main class="admin-content"><div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title">픽업일별 일반 주문</h1>
  <form class="admin-toolbar" method="get" th:action="@{/admin/fulfillment}">
    <input class="form-control" name="pickupDate" type="date" th:value="${pickupDate}">
    <button class="btn" type="submit">조회</button>
  </form>
  <div class="table-wrap"><table class="data-table"><thead><tr>
    <th>시간</th><th>주문번호</th><th>회원</th><th>상품</th><th>상태</th><th>처리</th>
  </tr></thead><tbody th:if="${orders != null}">
    <tr th:each="order : ${orders}">
      <td th:text="${#temporals.format(order.pickupAt, 'HH:mm')}">-</td>
      <td th:text="${order.orderNumber}">ORD-</td><td th:text="${order.memberName}">회원</td>
      <td th:text="${order.productSummary}">상품</td><td th:text="${order.status}">PAID</td>
      <td>
        <form method="post" th:if="${order.status == 'PAID'}"
              th:action="@{/admin/fulfillment/{id}/status(id=${order.id})}">
          <input type="hidden" name="status" value="READY_FOR_PICKUP">
          <input type="hidden" name="pickupDate" th:value="${pickupDate}">
          <button class="btn" type="submit">픽업 준비 완료</button>
        </form>
        <form method="post" th:if="${order.status == 'READY_FOR_PICKUP'}"
              th:action="@{/admin/fulfillment/{id}/status(id=${order.id})}">
          <input type="hidden" name="status" value="PICKED_UP">
          <input type="hidden" name="pickupDate" th:value="${pickupDate}">
          <button class="btn btn--primary" type="submit">픽업 완료</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">해당 날짜의 일반 주문이 없습니다.</td></tr>
  </tbody></table></div>
</main></div></div></body></html>
