<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common/head :: head('채팅 관리 | 관리자')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/chat.css}">
  <script defer th:src="@{/webjars/stomp__stompjs/7.3.0/bundles/stomp.umd.min.js}"></script>
  <script defer th:src="@{/js/admin-chat.js}"></script>
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('chat')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('채팅 관리')}"></header>
    <main class="admin-content" data-admin-chat-root
          th:attr="data-room-id=${selectedChat == null ? null : selectedChat.roomId}">
      <div class="admin-chat-heading">
        <div>
          <h1>채팅 관리</h1>
          <p class="text-muted">모든 관리자가 고객 상담을 함께 응대합니다.</p>
        </div>
        <span class="chat-connection" data-chat-connection>연결 중</span>
      </div>

      <div class="admin-chat-layout">
        <aside class="panel admin-chat-rooms">
          <form method="get" th:action="@{/admin/chat}" class="admin-chat-search">
            <input class="form-control" name="keyword" th:value="${keyword}"
                   placeholder="고객명 또는 이메일">
            <input type="hidden" name="filter" th:value="${filter}">
            <button class="btn" type="submit">검색</button>
          </form>
          <nav class="admin-chat-filters" aria-label="채팅 상태 필터">
            <a class="btn btn--xs" th:classappend="${filter == 'ALL'} ? ' is-active'"
               th:href="@{/admin/chat(keyword=${keyword},filter='ALL')}">전체</a>
            <a class="btn btn--xs" th:classappend="${filter == 'UNANSWERED'} ? ' is-active'"
               th:href="@{/admin/chat(keyword=${keyword},filter='UNANSWERED')}">미답변</a>
            <a class="btn btn--xs" th:classappend="${filter == 'CLOSED'} ? ' is-active'"
               th:href="@{/admin/chat(keyword=${keyword},filter='CLOSED')}">종료</a>
          </nav>

          <p class="chat-empty-list" th:if="${#lists.isEmpty(chatPage.rooms)}">조건에 맞는 상담이 없습니다.</p>
          <div class="admin-chat-room-list">
            <a th:each="room : ${chatPage.rooms}"
               class="admin-chat-room-item"
               th:classappend="${selectedChat != null && selectedChat.roomId == room.roomId} ? ' is-selected'"
               th:attr="data-room-summary=${room.roomId}"
               th:href="@{/admin/chat(keyword=${keyword},filter=${filter},page=${chatPage.page},roomId=${room.roomId})}">
              <div class="cluster cluster--between">
                <strong th:text="${room.customerName}"></strong>
                <span class="badge badge--danger" th:if="${room.unanswered}">미답변</span>
                <span class="badge" th:if="${!room.unanswered && room.status == 'CLOSED'}">종료</span>
              </div>
              <span class="admin-chat-room-email" th:text="${room.customerEmail}"></span>
              <p data-room-preview th:text="${room.lastMessagePreview ?: '대화가 없습니다.'}"></p>
              <div class="cluster cluster--between">
                <span class="badge badge--danger" data-room-unread
                      th:hidden="${room.unreadCount == 0}"
                      th:text="|안 읽음 ${room.unreadCount}|"></span>
                <time class="text-muted" th:if="${room.lastMessageAt != null}"
                      th:text="${#temporals.format(room.lastMessageAt, 'MM.dd HH:mm')}"></time>
              </div>
            </a>
          </div>

          <nav class="chat-pagination" th:if="${chatPage.totalPages > 1}">
            <a class="btn btn--xs" th:if="${chatPage.page > 0}"
               th:href="@{/admin/chat(keyword=${keyword},filter=${filter},page=${chatPage.page - 1})}">이전</a>
            <span th:text="|${chatPage.page + 1} / ${chatPage.totalPages}|"></span>
            <a class="btn btn--xs" th:if="${chatPage.page + 1 < chatPage.totalPages}"
               th:href="@{/admin/chat(keyword=${keyword},filter=${filter},page=${chatPage.page + 1})}">다음</a>
          </nav>
        </aside>

        <section class="panel chat-room admin-chat-room" th:if="${selectedChat != null}">
          <header class="chat-room__header">
            <div>
              <strong th:text="|${selectedChat.customerName} 고객님|"></strong>
              <p class="text-muted" th:text="${selectedChat.customerEmail}"></p>
            </div>
            <div class="cluster">
              <span class="badge" data-room-status th:text="${selectedChat.statusLabel}"
                    th:classappend="${selectedChat.status == 'OPEN'} ? ' badge--success'"></span>
              <button type="button" class="btn btn--danger" data-close-room
                      th:disabled="${selectedChat.status == 'CLOSED'}">상담 종료</button>
            </div>
          </header>

          <button type="button" class="btn chat-load-older" data-load-older
                  th:hidden="${#lists.isEmpty(selectedChat.messages)}">이전 대화 불러오기</button>
          <div class="chat-messages" data-chat-messages aria-live="polite">
            <div class="chat-empty" data-chat-empty th:hidden="${!#lists.isEmpty(selectedChat.messages)}">
              <strong>아직 대화가 없습니다.</strong>
            </div>
            <article th:each="message : ${selectedChat.messages}"
                     class="chat-msg"
                     th:classappend="${message.senderType == 'SYSTEM'} ? ' chat-msg--system' :
                         (${message.senderType == 'ADMIN'} ? ' chat-msg--me' : ' chat-msg--other')"
                     th:attr="data-message-id=${message.id},data-sender-type=${message.senderType}">
              <span class="chat-msg__sender" th:if="${message.senderType == 'CUSTOMER'}"
                    th:text="${selectedChat.customerName}"></span>
              <div class="chat-msg__body">
                <img class="chat-msg__image" th:if="${message.hasImage}"
                     th:src="${message.imageUrl}" alt="채팅 첨부 이미지">
                <p class="chat-msg__content" th:if="${message.content != null}"
                   th:text="${message.content}"></p>
                <a class="btn btn--primary chat-msg__action"
                   th:if="${message.actionUrl != null}"
                   th:href="${message.actionUrl}">주문제작 시작하기</a>
              </div>
              <div class="chat-msg__meta" th:if="${message.senderType != 'SYSTEM'}">
                <span class="chat-msg__read" th:if="${message.senderType == 'ADMIN'}"
                      th:text="${message.read} ? '읽음' : '읽지 않음'"></span>
                <time th:text="${#temporals.format(message.createdAt, 'MM.dd HH:mm')}"></time>
              </div>
            </article>
          </div>

          <div class="chat-compose" th:classappend="${selectedChat.status == 'CLOSED'} ? ' is-disabled'">
            <div class="chat-preview" data-image-preview hidden>
              <img alt="전송 전 이미지 미리보기">
              <span data-image-name></span>
              <button type="button" class="btn btn--xs" data-image-clear>첨부 취소</button>
            </div>
            <p class="form-error" data-chat-error role="alert" hidden></p>
            <form data-chat-form enctype="multipart/form-data">
              <div class="chat-input-toolbar">
                <label class="btn btn--outline">
                  이미지 첨부
                  <input type="file" name="image" accept="image/jpeg,image/png"
                         data-chat-image hidden th:disabled="${selectedChat.status == 'CLOSED'}">
                </label>
                <select class="form-control chat-quick-reply" data-quick-reply
                        th:disabled="${selectedChat.status == 'CLOSED'}">
                  <option value="">빠른 답변 선택</option>
                  <option value="문의 내용을 확인했습니다. 잠시만 기다려 주세요.">확인 안내</option>
                  <option value="요청하신 내용으로 제작 가능합니다.">제작 가능 안내</option>
                  <option value="죄송합니다. 해당 일정은 제작 예약이 마감되었습니다.">일정 마감 안내</option>
                  <option value="픽업 시간 변경 내용을 확인했습니다.">픽업 시간 안내</option>
                </select>
              </div>
              <div class="chat-input-row">
                <textarea class="form-control" name="content" data-chat-input maxlength="2000"
                          rows="2" placeholder="고객에게 보낼 메시지"
                          th:disabled="${selectedChat.status == 'CLOSED'}"></textarea>
                <button type="submit" class="btn btn--primary" data-chat-send
                        th:disabled="${selectedChat.status == 'CLOSED'}">전송</button>
              </div>
            </form>
          </div>
        </section>

        <section class="panel admin-chat-placeholder" th:if="${selectedChat == null}">
          <strong>상담방을 선택해 주세요.</strong>
        </section>

        <aside class="panel admin-chat-orders">
          <strong>연결된 주문</strong>
          <div class="chat-empty-side">
            <p>연결된 주문이 없습니다.</p>
            <span>주문 연결 조작은 주문제작 후속 범위입니다.</span>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>
</body>
</html>
