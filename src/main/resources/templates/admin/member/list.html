<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>회원 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('members')}"></aside><div class="admin-main"><header th:replace="~{fragments/admin/header :: header('회원 관리')}"></header><main class="admin-content">
<div th:replace="~{fragments/admin/mock-notice :: notice}"></div><h1 class="admin-page-title">회원 관리</h1><form class="admin-toolbar" method="get" th:action="@{/admin/members}"><input class="form-control" name="name" aria-label="이름 검색" placeholder="이름 검색"><input class="form-control" name="email" aria-label="이메일 검색" placeholder="이메일 검색"><select class="form-control" name="status" aria-label="회원 상태"><option>상태 전체</option><option>정상</option><option>이용 제한</option></select><button class="btn" type="submit">검색</button></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>이름</th><th>이메일</th><th>전화번호</th><th>가입일</th><th>주문 횟수</th><th>회원 상태</th><th>관리</th></tr></thead><tbody>
<tr><td>홍길동</td><td>hong@example.com</td><td>010-0000-0000</td><td>2024.01.15</td><td>12회</td><td><span class="badge badge--success">정상</span></td><td><div class="cluster"><button class="btn" type="button">상세</button><button class="btn btn--danger" type="button" data-confirm="이용을 제한하시겠습니까?">이용 제한</button></div></td></tr>
<tr><td>이영희</td><td>lee@example.com</td><td>010-1111-1111</td><td>2024.02.20</td><td>5회</td><td><span class="badge badge--success">정상</span></td><td><div class="cluster"><button class="btn" type="button">상세</button><button class="btn btn--danger" type="button">이용 제한</button></div></td></tr>
<tr><td>박민수</td><td>park@example.com</td><td>010-2222-2222</td><td>2024.03.10</td><td>2회</td><td><span class="badge badge--danger">이용 제한</span></td><td><div class="cluster"><button class="btn" type="button">상세</button><button class="btn btn--danger" type="button">제한 해제</button></div></td></tr>
</tbody></table></div></main></div></div></body></html>
