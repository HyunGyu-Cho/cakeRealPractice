<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('결제·환불 관리')}"></head>
<body><div class="admin-layout">
<aside th:replace="~{fragments/admin/sidebar :: sidebar('payments')}"></aside>
<div class="admin-main"><header th:replace="~{fragments/admin/header :: header('결제·환불 관리')}"></header>
<main class="admin-content"><div th:replace="~{fragments/common/alert :: alert}"></div>
  <h1 class="admin-page-title">결제·환불 내역</h1>
  <form class="admin-toolbar" method="get" th:action="@{/admin/payments}" th:object="${cond}">
    <select class="form-control" th:field="*{status}"><option value="">상태 전체</option>
      <option value="DONE">결제 완료</option><option value="CANCELED">취소 완료</option></select>
    <select class="form-control" th:field="*{method}"><option value="">수단 전체</option>
      <option value="CARD">카드</option><option value="KAKAO">카카오페이</option>
      <option value="NAVER">네이버페이</option><option value="TOSS">토스페이</option>
      <option value="BANK">무통장</option></select>
    <input class="form-control" th:field="*{paidFrom}" type="date">
    <input class="form-control" th:field="*{paidTo}" type="date">
    <button class="btn" type="submit">조회</button>
  </form>
  <div class="table-wrap"><table class="data-table"><thead><tr>
    <th>결제 키</th><th>주문번호</th><th>회원</th><th>수단</th><th>금액</th><th>상태</th><th>취소 내역</th><th>처리</th>
  </tr></thead><tbody th:if="${payments != null}">
    <tr th:each="payment : ${payments.content}">
      <td th:text="${payment.paymentKey}">MOCK-</td><td th:text="${payment.orderNumber}">ORD-</td>
      <td th:text="${payment.memberName}">회원</td><td th:text="${payment.method}">CARD</td>
      <td th:text="${#numbers.formatInteger(payment.amount, 0, 'COMMA') + '원'}">0원</td>
      <td th:text="${payment.status}">DONE</td>
      <td><span th:if="${payment.cancellationStatus != null}"
                th:text="${payment.cancellationStatus + ' · ' + payment.cancellationReason}">DONE</span></td>
      <td><form method="post" th:if="${payment.status == 'DONE'}"
                th:action="@{/admin/payments/orders/{id}/cancel(id=${payment.orderId})}">
        <input class="form-control" name="reason" required placeholder="관리자 취소 사유">
        <button class="btn btn--danger" type="submit">전액 취소</button>
      </form></td>
    </tr>
    <tr th:if="${#lists.isEmpty(payments.content)}"><td colspan="8">결제 내역이 없습니다.</td></tr>
  </tbody></table></div>
  <nav class="cluster" th:if="${payments != null and payments.totalPages > 1}" aria-label="결제 페이지">
    <a class="btn" th:if="${payments.page > 1}"
       th:href="@{/admin/payments(page=${payments.page - 1},size=${payments.size},status=${cond.status},method=${cond.method},paidFrom=${cond.paidFrom},paidTo=${cond.paidTo})}">이전</a>
    <span th:text="${payments.page + ' / ' + payments.totalPages}">1 / 1</span>
    <a class="btn" th:if="${payments.page < payments.totalPages}"
       th:href="@{/admin/payments(page=${payments.page + 1},size=${payments.size},status=${cond.status},method=${cond.method},paidFrom=${cond.paidFrom},paidTo=${cond.paidTo})}">다음</a>
  </nav>
</main></div></div></body></html>
