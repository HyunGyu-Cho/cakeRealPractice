<!--
  PageResult 기반 공통 페이지네이션.
  baseUrl: 페이지 링크의 기본 경로 (예: '/community')
  extraQuery: page 외에 유지할 쿼리 문자열. '&category=REVIEW' 형태(맨 앞 & 포함)이거나 빈 문자열.
  현재 페이지 앞뒤로 최대 5개의 번호를 노출한다.
-->
<nav th:fragment="pagination(pageResult, baseUrl, extraQuery)"
     th:if="${pageResult.totalPages > 1}"
     class="cluster section" style="justify-content:center" aria-label="페이지 이동"
     th:with="current=${pageResult.page},
              total=${pageResult.totalPages},
              rawStart=${current - 2 < 1 ? 1 : current - 2},
              windowEnd=${rawStart + 4 > total ? total : rawStart + 4},
              windowStart=${windowEnd - 4 < 1 ? 1 : windowEnd - 4}">
    <a class="btn" th:if="${current > 1}"
       th:href="@{|${baseUrl}?page=${current - 1}${extraQuery}|}">이전</a>
    <a class="btn" th:each="i : ${#numbers.sequence(windowStart, windowEnd)}"
       th:classappend="${i == current} ? 'is-active'"
       th:href="@{|${baseUrl}?page=${i}${extraQuery}|}" th:text="${i}">1</a>
    <a class="btn" th:if="${current < total}"
       th:href="@{|${baseUrl}?page=${current + 1}${extraQuery}|}">다음</a>
</nav>
