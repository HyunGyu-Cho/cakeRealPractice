<th:block th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
  <!--/*
    전 화면 공통 <head> 내용. 화면은 자기 <head> 안에서 이 프래그먼트를 먼저 부르고
    화면 고유 리소스(전용 CSS·JS)만 뒤에 이어 쓴다.

        <head>
          <th:block th:replace="~{fragments/common/head :: head('장바구니 | 케이크 쇼핑몰')}"></th:block>
          <script defer th:src="@{/js/cart.js}"></script>
        </head>

    ⚠️ app.js는 여기서만 로드한다. 화면이나 다른 프래그먼트(관리자 header 등)에서 또 붙이면
       같은 파일이 두 번 실행돼 document 리스너가 2벌 등록되고 [data-confirm] 확인창이 두 번 뜬다.
    ⚠️ CSRF meta는 AJAX를 쓰는 화면만 필요하지만 화면마다 적으면 빠뜨리기 쉬워 공통으로 둔다.
       토큰이 없는 요청도 있어 null 검사를 붙였다.

    이 블록은 Thymeleaf 파서 주석이라 렌더된 HTML에 나가지 않는다. 일반 HTML 주석으로 쓰면
    전 화면의 페이지 소스에 이 설명이 그대로 실린다. 본문에 주석 닫는 기호를 쓰면 안 된다.
  */-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
  <title th:text="${title}">케이크 쇼핑몰</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</th:block>
