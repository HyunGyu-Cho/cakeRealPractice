<header class="admin-header" th:fragment="header(title)"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <strong class="admin-header__title" th:text="${title}">관리자 화면</strong>
  <div class="cluster">
    <a class="btn" th:href="@{/admin/notifications}" data-notification-badge
       th:text="|알림 (${unreadNotificationCount ?: 0})|">알림 (0)</a>
    <a class="btn" th:href="@{/}">고객 화면</a>
    <span class="note" sec:authentication="name">관리자</span>
    <form th:action="@{/logout}" method="post">
      <button class="btn" type="submit">로그아웃</button>
    </form>
  </div>
  <!-- app.js는 여기서 로드하지 않는다. 고객·관리자 공통으로 fragments/common/head 한 곳이 소유한다
       (여기서도 붙이면 head를 함께 쓰는 화면에서 두 번 실행돼 핸들러가 2벌 등록된다). -->
</header>
