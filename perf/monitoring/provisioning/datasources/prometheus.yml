# Grafana 가 부팅할 때 데이터소스를 자동 등록한다 (UI에서 손으로 추가할 필요 없음).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9091
    isDefault: true
    uid: cakeshop-prom
    jsonData:
      # prometheus.yml 의 scrape_interval 과 맞춰야 그래프가 끊겨 보이지 않는다.
      timeInterval: 5s
