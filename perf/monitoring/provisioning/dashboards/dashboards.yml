# dashboards/ 폴더의 JSON을 Grafana 부팅 시 자동 등록한다.
apiVersion: 1

providers:
  - name: cakeshop
    type: file
    disableDeletion: false
    # UI에서 고친 내용이 파일로 저장되지 않는다는 뜻. 대시보드 수정은 JSON을 직접 고친다.
    allowUiUpdates: false
    options:
      path: ${CAKESHOP_DASHBOARD_DIR}
      foldersFromFilesStructure: false
