# cakeshop 지표 수집 설정
#
# 포트 배치 (충돌 주의):
#   8080  앱 서비스
#   9090  앱 actuator 관리 포트  ← Prometheus 기본 포트와 같아서
#   9091  Prometheus 자신        ← 이쪽으로 옮겼다 (--web.listen-address=:9091)
#   3000  Grafana
#
# 앱은 --spring.profiles.active=local,monitor 로 떠 있어야 한다.

global:
  # 부하 측정이 15초짜리라 기본 15초로는 표본이 1~2개뿐이다. 5초로 좁힌다.
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: cakeshop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: cakeshop

  # Prometheus 자신의 상태 (수집이 밀리는지 확인용)
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9091']
