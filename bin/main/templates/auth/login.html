<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>로그인</h1>
    <p class="alert alert--error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="alert alert--success" th:if="${param.logout}">로그아웃했습니다.</p>

    <!-- 인증 과정: POST /login은 컨트롤러가 아니라 Spring Security Filter가 처리한다. -->
    <form class="form-stack" th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="email">이메일</label>
        <input id="email" class="form-control" type="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" class="form-control" type="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">로그인</button>
    </form>
    <hr class="divider">
    <div class="cluster cluster--between">
      <a class="btn" th:href="@{/signup}">회원가입</a>
      <button class="btn" type="button" data-modal-open="password-modal">비밀번호 찾기</button>
    </div>
    <p class="form-help">관리자는 같은 로그인 폼에서 관리자 계정으로 로그인합니다.</p>
  </section>

  <div class="modal" id="password-modal" hidden>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
      <h2 id="password-modal-title">비밀번호 찾기</h2>
      <p class="note">이메일 발송 기능 연결 전 화면 확인용입니다.</p>
      <div class="form-group">
        <label class="form-label" for="find-email">이메일</label>
        <input class="form-control" id="find-email" type="email" placeholder="example@email.com">
      </div>
      <div class="cluster">
        <button class="btn btn--primary" type="button" disabled>인증 메일 발송 준비 중</button>
        <button class="btn" type="button" data-modal-close>닫기</button>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
