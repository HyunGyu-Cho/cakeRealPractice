<footer class="customer-footer" th:fragment="footer(store)">
  <div class="customer-footer__inner">
    <p><strong th:text="${store != null ? store.name : 'OO케이크'}">OO케이크</strong> |
      주소: <span th:text="${store != null ? store.address : '서울시 OO구 OO로'}">서울시 OO구 OO로</span> |
      연락처: <span th:text="${store != null ? store.phone : '02-0000-0000'}">02-0000-0000</span></p>
    <p>영업시간: <span th:text="${store != null ? store.businessHours : '10:00 ~ 20:00'}">10:00 ~ 20:00</span> |
      픽업 장소: <span th:text="${store != null ? store.pickupPlace : '1층 카운터'}">1층 카운터</span></p>
    <p class="customer-footer__copyright">&copy; <span data-current-year>2026</span>
      <span th:text="${store != null ? store.name : 'OO케이크'}">OO케이크</span></p>
  </div>
</footer>
