<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>후기 관리 | 관리자</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div class="admin-layout"><aside th:replace="~{fragments/admin/sidebar :: sidebar('reviews')}"></aside><div class="admin-main"><header th:replace="~{fragments/admin/header :: header('후기 관리')}"></header><main class="admin-content">
<div th:replace="~{fragments/admin/mock-notice :: notice}"></div><h1 class="admin-page-title">후기 관리</h1><form class="admin-toolbar" method="get" th:action="@{/admin/reviews}"><input class="form-control" name="writer" aria-label="작성자 검색" placeholder="작성자 검색"><input class="form-control" name="product" aria-label="상품명 검색" placeholder="상품명 검색"><select class="form-control" name="rating" aria-label="평점"><option>평점 전체</option><option>5점</option><option>4점</option><option>3점 이하</option></select><button class="btn" type="submit">검색</button></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>작성자</th><th>상품명</th><th>평점</th><th>내용 미리보기</th><th>작성일</th><th>관리</th></tr></thead><tbody>
<tr><td>홍길동</td><td>딸기 생크림 케이크</td><td>★★★★★ 5.0</td><td>맛있고 예뻐요. 다음에도 주문할게요.</td><td>2025.01.15</td><td><div class="cluster"><button class="btn" type="button">상세보기</button><button class="btn btn--danger" type="button">숨김</button><button class="btn btn--danger" type="button" data-confirm="후기를 삭제하시겠습니까?">삭제</button></div></td></tr>
<tr><td>이영희</td><td>레터링 케이크</td><td>★★★★☆ 4.0</td><td>레터링이 예쁘게 나왔어요. 조금...</td><td>2025.01.10</td><td><div class="cluster"><button class="btn" type="button">상세보기</button><button class="btn btn--danger" type="button">숨김</button><button class="btn btn--danger" type="button">삭제</button></div></td></tr>
<tr><td>박민수</td><td>초코 케이크</td><td>★★★☆☆ 3.0</td><td>맛은 괜찮은데 배달이 늦었어요.</td><td>2025.01.05</td><td><div class="cluster"><button class="btn" type="button">상세보기</button><button class="btn btn--danger" type="button">숨김</button><button class="btn btn--danger" type="button">삭제</button></div></td></tr>
</tbody></table></div></main></div></div></body></html>
