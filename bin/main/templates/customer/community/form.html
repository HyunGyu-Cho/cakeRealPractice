<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="글쓰기">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>

    <h1>글쓰기</h1>

    <!-- data-mock-form: 등록 시 customer-mockup.js가 필수값 검증 후 목록으로 이동한다. -->
    <form data-mock-form data-success-url="/community">
      <div class="form-group">
        <label class="form-label" for="category">분류 <span class="required">*</span></label>
        <select class="form-control" id="category" required>
          <option value="">선택하세요</option>
          <option value="review">후기</option>
          <option value="question">질문</option>
          <option value="free">자유</option>
          <option value="recipe">레시피</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="title">제목 <span class="required">*</span></label>
        <input class="form-control" id="title" type="text" placeholder="제목을 입력하세요" maxlength="100" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="content">내용 <span class="required">*</span></label>
        <textarea class="form-control form-control--textarea" id="content" style="min-height:220px"
                  placeholder="내용을 입력하세요" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="images">사진 첨부</label>
        <input class="form-control" id="images" type="file" accept="image/*" multiple>
        <p class="form-help">JPG·PNG 이미지를 최대 5장까지 첨부할 수 있습니다.</p>
      </div>

      <div class="cluster cluster--between section">
        <a class="btn" th:href="@{/community}">취소</a>
        <button class="btn btn--primary" type="submit">등록</button>
      </div>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
