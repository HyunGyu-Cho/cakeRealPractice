<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후기 작성 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="후기 작성">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <h1>후기 작성</h1><section class="section"><h2 class="section-title">주문 상품</h2><div class="panel cluster"><div class="placeholder-image placeholder-image--sm">상품 이미지</div><div><strong>딸기 생크림 케이크</strong><p class="text-muted">ORD-20250110-003 | 픽업 완료</p></div></div></section><form data-mock-form data-success-url="/orders/1"><section class="section"><h2 class="section-title">평점 선택</h2><div class="panel stack" data-select-group><div class="cluster"><span style="width:45px">맛</span><button class="btn" data-select type="button">1점</button><button class="btn" data-select type="button">2점</button><button class="btn" data-select type="button">3점</button><button class="btn" data-select type="button">4점</button><button class="btn" data-select type="button">5점</button></div><div class="cluster"><span style="width:45px">디자인</span><button class="btn" type="button">1점</button><button class="btn" type="button">2점</button><button class="btn" type="button">3점</button><button class="btn" type="button">4점</button><button class="btn" type="button">5점</button></div><div class="cluster"><span style="width:45px">포장</span><button class="btn" type="button">1점</button><button class="btn" type="button">2점</button><button class="btn" type="button">3점</button><button class="btn" type="button">4점</button><button class="btn" type="button">5점</button></div><div class="cluster"><span style="width:45px">응대</span><button class="btn" type="button">1점</button><button class="btn" type="button">2점</button><button class="btn" type="button">3점</button><button class="btn" type="button">4점</button><button class="btn" type="button">5점</button></div></div></section><section class="section"><h2 class="section-title">후기 내용</h2><div class="panel"><div class="form-group"><label class="form-label" for="review-content">내용 <span class="required">*</span></label><textarea class="form-control form-control--textarea" id="review-content" minlength="10" placeholder="후기를 작성해 주세요 (최소 10자 이상)" required></textarea></div><div class="form-group"><label class="form-label" for="review-image">이미지 첨부 (선택, 최대 3장)</label><input class="form-control" id="review-image" type="file" accept="image/*" multiple></div></div></section><div class="cluster"><button class="btn btn--primary" type="submit">후기 등록</button><button class="btn" type="button">수정하기</button><button class="btn btn--danger" type="button" data-confirm="후기를 삭제하시겠습니까?">삭제하기</button></div></form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
