<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문서·쿠폰 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="주문서·쿠폰">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container ">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <h1>주문서 작성</h1><form class="layout-main-aside" data-mock-form data-success-url="/orders/1/payment"><div class="stack"><section><h2 class="section-title">주문 상품</h2><div class="stack" data-order-items><div class="panel cluster"><div class="placeholder-image placeholder-image--sm">상품 이미지</div><div><strong>딸기 생크림 케이크</strong><p class="text-muted">일반 | 1개 | 35,000원</p><div class="data-row"><span class="data-row__label">픽업 일시</span><span>2025.01.17 14:00</span></div></div></div></div></section>
      <section><h2 class="section-title">주문자 정보</h2><div class="panel"><div class="form-group"><label class="form-label" for="order-name">이름 <span class="required">*</span></label><input class="form-control" id="order-name" value="홍길동" required></div><div class="form-group"><label class="form-label" for="order-phone">전화번호 <span class="required">*</span></label><input class="form-control" id="order-phone" type="tel" value="010-0000-0000" required></div></div></section><section><h2 class="section-title">픽업 요청사항</h2><div class="panel"><label class="form-label" for="pickup-note">요청사항</label><textarea class="form-control form-control--textarea" id="pickup-note" placeholder="픽업 시 특이사항 또는 요청사항 입력"></textarea></div></section>
      <section><h2 class="section-title">쿠폰 선택</h2><div class="panel"><div class="form-group"><label class="form-label" for="coupon-select">사용할 쿠폰</label><select class="form-control" id="coupon-select"><option>쿠폰을 선택하세요</option><option>첫 주문 할인 쿠폰</option><option>10% 할인 쿠폰</option></select></div><div class="stack"><div class="panel cluster cluster--between"><div><strong>첫 주문 할인 쿠폰</strong><p class="text-muted">5,000원 할인 | 최소 30,000원 이상</p></div><button class="btn" type="button" data-coupon-select>사용</button></div><div class="panel cluster cluster--between"><div><strong>10% 할인 쿠폰</strong><p class="text-muted">10% 할인 | 최소 20,000원 이상</p></div><button class="btn" type="button" data-coupon-select>사용</button></div></div></div></section></div>
      <aside class="order-summary"><h2 class="section-title">결제 금액</h2><div class="data-row"><span class="data-row__label">상품 금액</span><span data-order-base>35,000원</span></div><div class="data-row"><span class="data-row__label">옵션 추가</span><span data-order-options>0원</span></div><div class="data-row"><span class="data-row__label">쿠폰 할인</span><span data-discount>0원</span></div><div class="data-row"><span class="data-row__label">최종 결제 금액</span><strong data-total data-order-total="35000">35,000원</strong></div><button class="btn btn--primary btn--block" type="submit" style="margin-top:12px">결제하기</button></aside></form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
